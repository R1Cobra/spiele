<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Berg-Racer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; position:fixed; touch-action:none;
    background:#8fd3f4; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #game { display:block; width:100%; height:100%; }
  .hidden { display:none !important; }

  /* ---------- Overlays ---------- */
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(15,35,55,.78); z-index:20;
    backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); color:#fff; text-align:center;
    padding:16px; padding-top:calc(env(safe-area-inset-top) + 12px); overflow-y:auto; }
  .title { font-size:min(11vw,54px); font-weight:900; letter-spacing:-1px; line-height:1;
    color:#e8a020; text-shadow:0 4px 0 #8a5a00, 0 9px 20px rgba(0,0,0,.45); margin-bottom:6px; }
  .subtitle { font-size:min(4.2vw,17px); opacity:.92; margin-bottom:16px; max-width:400px; line-height:1.45; }
  .btn { background:linear-gradient(#f0b43a,#e8a020); color:#3a2400; border:none;
    font-size:20px; font-weight:900; padding:15px 38px; border-radius:16px;
    box-shadow:0 5px 0 #a06c00, 0 8px 16px rgba(0,0,0,.35); margin:8px 6px; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #a06c00; }
  .btn.sec { background:linear-gradient(#e8eef2,#c3ccd4); color:#1a3a5c; box-shadow:0 5px 0 #8d99a3, 0 8px 16px rgba(0,0,0,.3); }
  .btn.sec:active { box-shadow:0 2px 0 #8d99a3; }

  /* ---------- Fahrzeug-Auswahl ---------- */
  #vehGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;
    width:100%; max-width:470px; margin:4px 0 14px; }
  .veh { background:rgba(255,255,255,.1); border:2.5px solid rgba(255,255,255,.28); border-radius:16px;
    padding:10px 8px 12px; cursor:pointer; transition:transform .1s, border-color .15s, background .15s; }
  .veh:active { transform:scale(.96); }
  .veh.sel { border-color:#e8a020; background:rgba(232,160,32,.22); }
  .veh canvas { display:block; width:100%; height:52px; }
  .veh .vn { font-size:14px; font-weight:800; margin-top:4px; }
  .veh .vb { font-size:11px; opacity:.75; margin-top:2px; }
  .bars { display:flex; gap:3px; justify-content:center; margin-top:6px; }
  .bars i { width:16px; height:5px; border-radius:3px; background:rgba(255,255,255,.22); }
  .bars i.on { background:#7bd88f; }
  .bars i.on.p { background:#e8a020; }
  .bars i.on.g { background:#5bb8f0; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 0 12px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  #hudL { display:flex; flex-direction:column; gap:6px; margin-left:96px; }
  #hudR { display:flex; flex-direction:column; gap:6px; align-items:flex-end; margin-right:52px; }
  .box { background:rgba(15,35,55,.55); border-radius:12px; padding:5px 11px; color:#fff;
    font-weight:800; font-size:15px; text-shadow:0 1px 3px rgba(0,0,0,.4); white-space:nowrap; }
  #fuelWrap { display:flex; align-items:center; gap:7px; background:rgba(15,35,55,.55);
    border-radius:12px; padding:5px 11px 5px 9px; }
  #fuelBar { width:min(34vw,150px); height:12px; border-radius:7px; background:rgba(0,0,0,.35);
    overflow:hidden; border:1.5px solid rgba(255,255,255,.35); }
  #fuelFill { height:100%; width:100%; background:linear-gradient(90deg,#7bd88f,#c8e84a); transition:width .12s linear; }
  #fuelFill.low { background:linear-gradient(90deg,#e85a2a,#e8a020); }

  /* ---------- Pedale ---------- */
  #pedals { position:fixed; left:0; right:0; bottom:0; z-index:6;
    padding:0 calc(env(safe-area-inset-left) + 14px) calc(env(safe-area-inset-bottom) + 14px)
              calc(env(safe-area-inset-right) + 14px);
    display:flex; justify-content:space-between; pointer-events:none; }
  .pedal { pointer-events:auto; width:min(27vw,120px); height:min(27vw,120px); max-height:150px;
    border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:900; color:#fff; font-size:min(4vw,17px); letter-spacing:.5px;
    background:linear-gradient(#57687a,#384554); border:3px solid rgba(255,255,255,.35);
    box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 3px 10px rgba(255,255,255,.18); }
  .pedal .ic { font-size:min(8vw,34px); line-height:1; margin-bottom:3px; }
  .pedal.on { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.35); filter:brightness(1.25); }
  #gasPedal { background:linear-gradient(#3f9b52,#25703a); }
  #brakePedal { background:linear-gradient(#b8452e,#8a2e1c); }

  /* ---------- Toast ---------- */
  #toast { position:fixed; left:50%; top:26%; transform:translateX(-50%); z-index:8;
    font-size:min(9vw,40px); font-weight:900; color:#ffe27a; pointer-events:none;
    text-shadow:0 3px 0 #8a5a00, 0 6px 16px rgba(0,0,0,.5); opacity:0; transition:opacity .2s; }
  #toast.show { opacity:1; }

  /* ---------- Zurück zur Spiele-Auswahl ---------- */
  .kmf-back{
    position:fixed; z-index:9999;
    top:calc(env(safe-area-inset-top, 0px) + 10px);
    left:calc(env(safe-area-inset-left, 0px) + 10px);
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 13px; border-radius:14px;
    font:700 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:#f1f5f9; text-decoration:none; white-space:nowrap;
    background:rgba(15,23,42,.72);
    border:1.5px solid rgba(255,255,255,.3);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
  }
  .kmf-back:active{ transform:scale(.94); }
  #soundBtn { position:fixed; z-index:9999; top:calc(env(safe-area-inset-top,0px) + 10px);
    right:calc(env(safe-area-inset-right,0px) + 10px); border:none; cursor:pointer;
    padding:9px 12px; border-radius:14px; font-size:16px; background:rgba(15,23,42,.72);
    border:1.5px solid rgba(255,255,255,.3); color:#fff; }
  .stat { font-size:16px; opacity:.92; margin:2px 0; }
  .big { font-size:min(9vw,42px); font-weight:900; margin:4px 0 2px; }
  .rec { color:#7bd88f; font-weight:900; font-size:18px; margin-top:6px; }
</style>
</head>
<body>
<a href="../" class="kmf-back" aria-label="Zurück zur Spiele-Auswahl">🎮 Spiele</a>
<button id="soundBtn" title="Ton an/aus">🔊</button>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudL">
    <div id="fuelWrap"><span style="font-size:16px">⛽</span><div id="fuelBar"><div id="fuelFill"></div></div></div>
    <div class="box" id="coinHud">🪙 0</div>
  </div>
  <div id="hudR">
    <div class="box" id="distHud">0 m</div>
    <div class="box" id="bestHud">🏆 0 m</div>
  </div>
</div>

<div id="toast"></div>

<div id="pedals" class="hidden">
  <div class="pedal" id="brakePedal"><span class="ic">◀</span>BREMSE</div>
  <div class="pedal" id="gasPedal"><span class="ic">▶</span>GAS</div>
</div>

<div id="startScreen" class="overlay">
  <div class="title">🏔️ BERG-RACER</div>
  <div class="subtitle">Fahr so weit du kannst den Berg hinauf! Sammle 🪙 Münzen und ⛽ Benzin – und lande immer auf den Rädern.</div>
  <div id="vehGrid"></div>
  <button class="btn" id="startBtn">Losfahren!</button>
  <div class="stat" style="margin-top:10px">Gesamt gesammelt: <b id="totalCoins">0</b> 🪙</div>
</div>

<div id="overScreen" class="overlay hidden">
  <div class="big" id="overTitle">Aus!</div>
  <div class="stat" id="overReason"></div>
  <div class="big" id="overDist">0 m</div>
  <div class="stat" id="overCoins">🪙 0</div>
  <div class="rec hidden" id="overRec">🏆 Neuer Rekord!</div>
  <div style="margin-top:16px">
    <button class="btn" id="againBtn">Nochmal</button>
    <button class="btn sec" id="menuBtn">Fahrzeug wechseln</button>
  </div>
</div>

<script>
"use strict";
const { Engine, World, Bodies, Body, Composite, Constraint, Vector } = Matter;

/* ==========================================================================
   1. FAHRZEUGE
   ========================================================================== */
const C = {
  blau:'#1a3a5c', blauD:'#122a44', orange:'#e8a020', orangeD:'#b87c10',
  gruen:'#1a7a4a', rot:'#c0392b', rotD:'#8e2a1f', grau:'#8ba0b2',
  reifen:'#22282e', felge:'#d8dde2', glas:'#bfe4f5'
};

const VEHICLES = {
  auto: {
    name:'Auto', tag:'Wendig & leicht',
    chassis:{ w:118, h:30, dens:0.0013 },
    wheels:[ {x:-40,y:20,r:20,drive:true}, {x:42,y:20,r:20,drive:true} ],
    climb:0.62, maxW:0.62, rev:0.30, susp:0.55, air:0.0022,
    head:{x:2,y:-30}, roof:34, stats:[3,3,3], draw:'car'
  },
  motorrad: {
    name:'Motorrad', tag:'Schnell, aber kipplig',
    chassis:{ w:86, h:16, dens:0.0011 },
    wheels:[ {x:-33,y:14,r:18,drive:false}, {x:34,y:14,r:18,drive:true} ],
    climb:0.72, maxW:0.85, rev:0.25, susp:0.5, air:0.0020,
    head:{x:-2,y:-44}, roof:48, stats:[5,2,1], draw:'moto'
  },
  lkw: {
    name:'Lastwagen', tag:'Stark & schwer',
    chassis:{ w:196, h:46, dens:0.0016 },
    wheels:[ {x:-72,y:28,r:26,drive:true}, {x:48,y:28,r:26,drive:true}, {x:82,y:28,r:26,drive:true} ],
    climb:0.54, maxW:0.42, rev:0.22, susp:0.62, air:0.0026,
    head:{x:56,y:-44}, roof:52, stats:[2,5,4], draw:'lkw'
  },
  autoanh: {
    name:'Auto + Anhänger', tag:'Der Anhänger schiebt!',
    chassis:{ w:118, h:30, dens:0.0013 },
    wheels:[ {x:-40,y:20,r:20,drive:true}, {x:42,y:20,r:20,drive:true} ],
    climb:0.60, maxW:0.58, rev:0.28, susp:0.55, air:0.0022,
    head:{x:2,y:-30}, roof:34, stats:[3,3,4], draw:'car',
    trailer:{ w:76, h:26, dens:0.0011, hitchA:{x:-62,y:8}, hitchB:{x:54,y:2},
              wheels:[{x:0,y:18,r:16}], draw:'anh' }
  },
  lkwanh: {
    name:'LKW + Anhänger', tag:'Die Königsklasse',
    chassis:{ w:196, h:46, dens:0.0016 },
    wheels:[ {x:-72,y:28,r:26,drive:true}, {x:48,y:28,r:26,drive:true}, {x:82,y:28,r:26,drive:true} ],
    climb:0.52, maxW:0.40, rev:0.20, susp:0.62, air:0.0026,
    head:{x:56,y:-44}, roof:52, stats:[2,5,5], draw:'lkw',
    trailer:{ w:150, h:42, dens:0.0013, hitchA:{x:-102,y:16}, hitchB:{x:98,y:10},
              wheels:[{x:-42,y:26,r:22},{x:38,y:26,r:22}], draw:'lkwanh' }
  }
};
const VKEYS = Object.keys(VEHICLES);

/* ==========================================================================
   2. GELÄNDE
   ========================================================================== */
const BASE_Y = 420;          // Höhe der Startebene in Weltpixeln
const SEG    = 26;           // Länge eines Bodenstücks
const PX_PER_M = 30;         // 30 Weltpixel = 1 Meter

function rnd1(i, seed){ const n = Math.sin(i*127.1 + seed*311.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, seed){
  const i = Math.floor(x), f = x - i, u = f*f*(3-2*f);
  return rnd1(i,seed)*(1-u) + rnd1(i+1,seed)*u;
}
function terrainY(x){
  if (x < 260) return BASE_Y;
  const t    = Math.min(1, (x-260)/1600);          // sanft einblenden
  const diff = 1 + Math.min(0.75, x/30000);        // wird laufend hügeliger
  let h = 0;
  h += (vnoise(x/1000, 7.1) - 0.5) * 320 * diff;
  h += (vnoise(x/380,  3.7) - 0.5) * 105 * diff;
  h += (vnoise(x/210,  5.5) - 0.5) * Math.min(85, x/700);   // Wellen & Sprünge, wachsen mit
  h += (vnoise(x/140,  9.3) - 0.5) * 26;
  return BASE_Y - h * t;
}
function terrainSlope(x){ return (terrainY(x+6) - terrainY(x-6)) / 12; }

/* ==========================================================================
   3. SPIELZUSTAND
   ========================================================================== */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
}
window.addEventListener('resize', resize); resize();

let engine = null, world = null;
let G = null;                                   // laufendes Spiel
let selected = localStorage.getItem('bergracer-veh') || 'auto';
if (!VEHICLES[selected]) selected = 'auto';
let totalCoins = +(localStorage.getItem('bergracer-coins') || 0);
function bestOf(k){ return +(localStorage.getItem('bergracer-best-'+k) || 0); }

const input = { gas:false, brake:false };

/* ==========================================================================
   4. FAHRZEUG BAUEN
   ========================================================================== */
let groupCounter = 0;
function addWheel(spec, cx, cy, group, chassis, suspStiff){
  const w = Bodies.circle(cx + spec.x, cy + spec.y, spec.r, {
    friction: 1.0, frictionStatic: 3, restitution: 0.02, frictionAir: 0.008,
    density: 0.0016, collisionFilter:{ group }, label:'wheel'
  });
  w.spec = spec;
  World.add(world, w);
  World.add(world, Constraint.create({
    bodyA: chassis, pointA: { x: spec.x, y: spec.y }, bodyB: w,
    stiffness: suspStiff, damping: 0.28, length: 0
  }));
  World.add(world, Constraint.create({
    bodyA: chassis, pointA: { x: spec.x, y: spec.y - 26 }, bodyB: w,
    stiffness: suspStiff*0.55, damping: 0.2, length: 26
  }));
  return w;
}

function buildVehicle(key, x, y){
  const V = VEHICLES[key];
  const group = --groupCounter;   // negative Gruppe: Teile prallen nicht aneinander
  const ch = Bodies.rectangle(x, y, V.chassis.w, V.chassis.h, {
    density: V.chassis.dens, friction: 0.4, restitution: 0.05,
    frictionAir: V.air, collisionFilter:{ group }, chamfer:{ radius: 6 }, label:'chassis'
  });
  World.add(world, ch);
  const wheels = V.wheels.map(s => addWheel(s, x, y, group, ch, V.susp));

  let trailer = null, twheels = [];
  if (V.trailer){
    const T = V.trailer;
    const tx = x + T.hitchA.x - T.hitchB.x;
    const tb = Bodies.rectangle(tx, y + T.hitchA.y - T.hitchB.y, T.w, T.h, {
      density: T.dens, friction: 0.4, restitution: 0.05, frictionAir: V.air,
      collisionFilter:{ group }, chamfer:{ radius: 5 }, label:'trailer'
    });
    World.add(world, tb);
    twheels = T.wheels.map(s => addWheel(s, tb.position.x, tb.position.y, group, tb, V.susp*0.8));
    World.add(world, Constraint.create({
      bodyA: ch, pointA: T.hitchA, bodyB: tb, pointB: T.hitchB,
      stiffness: 0.95, damping: 0.25, length: 4
    }));
    trailer = tb;
  }
  // Antriebsmoment an die tatsächliche Masse anpassen -> jedes Fahrzeug klettert gleich gut
  let M = ch.mass + wheels.reduce((a,w) => a + w.mass, 0);
  if (trailer) M += trailer.mass + twheels.reduce((a,w) => a + w.mass, 0);
  const dr = wheels.filter(w => w.spec.drive);
  const rAvg = dr.reduce((a,w) => a + w.spec.r, 0) / dr.length;
  const torque = (V.climb * M * rAvg) / (dr.length * 277);
  return { key, V, chassis: ch, wheels, trailer, twheels, group, torque, driven: dr };
}

/* ==========================================================================
   5. BODEN-PHYSIK (nachwachsende Platten)
   ========================================================================== */
function ensureGround(camX){
  const from = Math.floor((camX - 1100) / SEG);
  const to   = Math.floor((camX + 1500) / SEG);
  for (let i = from; i <= to; i++){
    if (G.ground.has(i)) continue;
    const x0 = i*SEG, x1 = x0+SEG;
    const y0 = terrainY(x0), y1 = terrainY(x1);
    const dx = x1-x0, dy = y1-y0;
    const len = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    const th = 90;
    const nx = -Math.sin(a)*th/2, ny = Math.cos(a)*th/2;
    const b = Bodies.rectangle((x0+x1)/2 + nx, (y0+y1)/2 + ny, len, th, {
      isStatic: true, angle: a, friction: 1.0, frictionStatic: 3, restitution: 0, label:'ground'
    });
    World.add(world, b);
    G.ground.set(i, b);
  }
  for (const [i, b] of G.ground){
    if (i < from-6 || i > to+6){ World.remove(world, b); G.ground.delete(i); }
  }
}

/* ==========================================================================
   6. SAMMELOBJEKTE
   ========================================================================== */
const SLOT = 165;
function slotItem(k){
  if (k < 3) return null;
  const x = k*SLOT + 70;
  const isFuel = (k % 19 === 4);
  return { k, x, y: terrainY(x) - (isFuel ? 46 : 58), fuel: isFuel };
}

/* ==========================================================================
   7. SPIEL STARTEN / BEENDEN
   ========================================================================== */
function startRun(key){
  engine = Engine.create({ gravity:{ x:0, y:1.35 }, positionIterations:8, velocityIterations:8 });
  world  = engine.world;
  G = {
    key, ground: new Map(), taken: new Set(),
    fuel: 100, coins: 0, dist: 0, maxX: 0, time: 0,
    air: 0, airSpin: 0, flips: 0, over: false, camX: 260, camY: BASE_Y-90, shake: 0,
    view: Math.max(900, 620*(W/Math.max(1,H))),
    particles: []
  };
  G.veh = buildVehicle(key, 260, terrainY(260) - 70);
  ensureGround(260);
  hud.classList.remove('hidden'); pedals.classList.remove('hidden');
  startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
  bestHud.textContent = '🏆 ' + bestOf(key) + ' m';
  updateHud();
  if (sound.on) sound.start();
}

function gameOver(reason, title){
  if (G.over) return;
  G.over = true;
  input.gas = input.brake = false;
  sound.stop();
  const m = Math.floor(G.maxX / PX_PER_M);
  totalCoins += G.coins;
  localStorage.setItem('bergracer-coins', totalCoins);
  const best = bestOf(G.key);
  const isRec = m > best;
  if (isRec) localStorage.setItem('bergracer-best-'+G.key, m);
  overTitle.textContent = title;
  overReason.textContent = reason;
  overDist.textContent = m + ' m';
  overCoins.textContent = '🪙 ' + G.coins + '   ·   ' + VEHICLES[G.key].name;
  overRec.classList.toggle('hidden', !isRec);
  setTimeout(() => {
    overScreen.classList.remove('hidden');
    pedals.classList.add('hidden');
  }, 750);
}

/* ==========================================================================
   8. PHYSIK-SCHRITT
   ========================================================================== */
function wheelOnGround(w){
  const ty = terrainY(w.position.x);
  return (w.position.y + w.spec.r) > ty - 7;
}

function step(dt){
  const V = G.veh.V, ch = G.veh.chassis;
  const hasFuel = G.fuel > 0;
  const gas = input.gas && hasFuel, brake = input.brake && hasFuel;

  // --- Antrieb ---
  let anyGround = false;
  const driven = G.veh.driven, TQ = G.veh.torque;
  for (const w of G.veh.wheels){ if (wheelOnGround(w)) anyGround = true; }
  for (const w of G.veh.twheels){ if (wheelOnGround(w)) anyGround = true; }

  for (const w of driven){
    if (gas && w.angularVelocity < V.maxW)  w.torque += TQ;
    if (brake && w.angularVelocity > -V.maxW*V.rev) w.torque -= TQ*0.8;
    if (!gas && !brake) Body.setAngularVelocity(w, w.angularVelocity * 0.985);
    if (w.angularVelocity > V.maxW*1.15) Body.setAngularVelocity(w, V.maxW*1.15);
  }

  // --- Gegenmoment am Boden: Gas hebt die Front, Bremse drückt sie runter ---
  if (anyGround && (gas || brake)){
    const soll = gas ? -0.26 : 0.18;                                 // Nase hoch / Nase runter
    const rel  = ch.angle - Math.atan(terrainSlope(ch.position.x));  // Neigung zum Hang
    const dw   = 0.009*(soll - rel) - 0.19*ch.angularVelocity;
    ch.torque += dw * ch.inertia / 277;
  }

  // --- Luftlage: mit Gas/Bremse drehen ---
  if (!anyGround){
    const rot = ch.mass * 0.011;
    if (gas)   ch.torque -= rot;
    if (brake) ch.torque += rot;
    G.air += dt;
    G.airSpin += ch.angularVelocity;
  } else {
    if (G.air > 0.45){
      const f = Math.floor(Math.abs(G.airSpin) / (Math.PI*2) + 0.12);
      if (f > 0){
        G.flips += f; G.coins += f*15;
        toastMsg(f > 1 ? (f + '× SALTO! +' + f*15 + '🪙') : 'SALTO! +15🪙');
      }
    }
    G.air = 0; G.airSpin = 0;
  }

  Engine.update(engine, dt*1000);

  // --- Benzin ---
  G.fuel -= dt * (1.35 + ((gas||brake) ? 1.5 : 0));
  if (G.fuel <= 0){ G.fuel = 0; }

  // --- Strecke ---
  G.dist = ch.position.x;
  if (G.dist > G.maxX) G.maxX = G.dist;
  G.time += dt;

  // --- Sammeln ---
  const kMin = Math.floor((ch.position.x - 200)/SLOT), kMax = Math.floor((ch.position.x + 200)/SLOT);
  for (let k = kMin; k <= kMax; k++){
    if (G.taken.has(k)) continue;
    const it = slotItem(k); if (!it) continue;
    if (Math.hypot(it.x - ch.position.x, it.y - ch.position.y) < 52){
      G.taken.add(k);
      if (it.fuel){ G.fuel = Math.min(100, G.fuel + 42); toastMsg('⛽ Nachgetankt!'); }
      else { G.coins += 5; }
      for (let p=0;p<8;p++) G.particles.push({ x:it.x, y:it.y, vx:(Math.random()-.5)*140,
        vy:-Math.random()*160-40, life:0.6, c: it.fuel ? '#7bd88f' : '#ffd24a' });
    }
  }

  // --- Staub unter den Antriebsrädern ---
  if (anyGround && (gas||brake) && Math.abs(ch.velocity.x) > 1 && Math.random() < 0.4){
    const w = driven[0];
    G.particles.push({ x: w.position.x - 4, y: w.position.y + w.spec.r*0.75,
      vx: -50 - Math.random()*110, vy: -20 - Math.random()*60, life: 0.45, c:'rgba(140,110,72,.7)' });
  }

  // --- Partikel ---
  for (const p of G.particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt; p.life -= dt; }
  G.particles = G.particles.filter(p => p.life > 0);

  // --- Boden nachbauen ---
  ensureGround(ch.position.x);

  // --- Crash: Kopf berührt den Boden ---
  const hp = bodyPoint(ch, V.head);
  if (hp.y > terrainY(hp.x) - 6){
    G.shake = 0.5;
    gameOver('Der Fahrer hat den Kopf angeschlagen.', '💥 Aua!');
    return;
  }
  // --- Benzin leer und steht still ---
  if (G.fuel <= 0 && Math.abs(ch.velocity.x) < 0.35 && anyGround){
    G.emptyT = (G.emptyT || 0) + dt;
    if (G.emptyT > 1.2) gameOver('Der Tank ist leer.', '⛽ Kein Benzin');
  } else G.emptyT = 0;

  // --- abgestürzt / stecken ---
  if (ch.position.y > BASE_Y + 3000) gameOver('Verloren gegangen.', '💥 Aus!');
}

function bodyPoint(b, off){
  const c = Math.cos(b.angle), s = Math.sin(b.angle);
  return { x: b.position.x + off.x*c - off.y*s, y: b.position.y + off.x*s + off.y*c };
}

/* ==========================================================================
   9. ZEICHNEN
   ========================================================================== */
function rr(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);     g.arcTo(x, y, x+w, y, r);
  g.closePath();
}

/* --- Räder --- */
function drawWheel(g, r){
  g.fillStyle = C.reifen; g.beginPath(); g.arc(0,0,r,0,7); g.fill();
  g.fillStyle = '#33393f'; g.beginPath(); g.arc(0,0,r*0.98,0,7); g.fill();
  g.fillStyle = C.felge;   g.beginPath(); g.arc(0,0,r*0.52,0,7); g.fill();
  g.fillStyle = '#9aa4ad'; g.beginPath(); g.arc(0,0,r*0.18,0,7); g.fill();
  g.strokeStyle = '#aab3bb'; g.lineWidth = Math.max(2, r*0.12);
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2;
    g.beginPath(); g.moveTo(Math.cos(a)*r*0.2, Math.sin(a)*r*0.2);
    g.lineTo(Math.cos(a)*r*0.46, Math.sin(a)*r*0.46); g.stroke();
  }
  g.strokeStyle = '#12161a'; g.lineWidth = Math.max(2, r*0.16);
  for (let i=0;i<8;i++){
    const a = i*Math.PI/4;
    g.beginPath();
    g.arc(0,0,r*0.85, a, a+0.28); g.stroke();
  }
}

/* --- Hintergrund --- */
function drawSky(g){
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#5cb8e8'); sky.addColorStop(0.55,'#a8dcf5'); sky.addColorStop(1,'#dff1fa');
  g.fillStyle = sky; g.fillRect(0,0,W,H);
  // Sonne
  g.fillStyle = 'rgba(255,240,180,.95)';
  g.beginPath(); g.arc(W*0.82, H*0.16, Math.min(W,H)*0.075, 0, 7); g.fill();
}
function drawFar(g, camX, camY, scale, anchorY){
  // zwei Bergketten mit Parallaxe
  const layers = [
    { p:0.20, amp:150, col:'#89b0c6', f:900, lift:120 },
    { p:0.40, amp:210, col:'#6d9a7e', f:600, lift:40  }
  ];
  for (const L of layers){
    g.fillStyle = L.col;
    g.beginPath();
    const off = camX * L.p;
    g.moveTo(0, H+2);
    for (let sx = 0; sx <= W+12; sx += 12){
      const wx = sx/scale + off;
      const hgt = vnoise(wx/L.f, 4.2)*L.amp + vnoise(wx/(L.f*0.35), 8.8)*L.amp*0.45;
      const mY  = BASE_Y + L.lift - hgt;                      // Welt-Höhe des Kamms
      g.lineTo(sx, anchorY + (mY - camY) * scale * (1 - L.p*0.55));
    }
    g.lineTo(W, H+2); g.closePath(); g.fill();
  }
}
function drawGround(g, camX, view){
  const x0 = camX - view/2 - 60, x1 = camX + view/2 + 60;
  g.beginPath();
  g.moveTo(x0, terrainY(x0));
  for (let x = x0; x <= x1; x += 7) g.lineTo(x, terrainY(x));
  const yBot = terrainY(x1) + 4000;
  g.lineTo(x1, yBot); g.lineTo(x0, yBot); g.closePath();
  const grd = ctx.createLinearGradient(0, BASE_Y-400, 0, BASE_Y+700);
  grd.addColorStop(0,'#8c6239'); grd.addColorStop(1,'#5a3d20');
  g.fillStyle = grd; g.fill();
  // Grasnarbe
  g.beginPath(); g.moveTo(x0, terrainY(x0));
  for (let x = x0; x <= x1; x += 7) g.lineTo(x, terrainY(x));
  g.strokeStyle = '#3f9b52'; g.lineWidth = 16; g.lineJoin='round'; g.stroke();
  g.strokeStyle = '#57c46b'; g.lineWidth = 6; g.stroke();
  // Steinchen
  g.fillStyle = 'rgba(0,0,0,.13)';
  const s0 = Math.floor(x0/60)*60;
  for (let x = s0; x < x1; x += 60){
    const r = rnd1(x, 5.5), r2 = rnd1(x, 9.9);
    g.beginPath(); g.arc(x + r*40, terrainY(x) + 40 + r2*260, 3 + r*7, 0, 7); g.fill();
  }
}
function drawItems(g, camX, view){
  const kMin = Math.floor((camX - view/2 - 100)/SLOT), kMax = Math.floor((camX + view/2 + 100)/SLOT);
  const t = G.time;
  for (let k = kMin; k <= kMax; k++){
    if (G.taken.has(k)) continue;
    const it = slotItem(k); if (!it) continue;
    const bob = Math.sin(t*3 + k)*4;
    g.save(); g.translate(it.x, it.y + bob);
    if (it.fuel){
      g.fillStyle = '#c0392b'; rr(g, -13, -16, 26, 32, 4); g.fill();
      g.fillStyle = '#8e2a1f'; rr(g, -13, 6, 26, 10, 3); g.fill();
      g.fillStyle = '#e05a45'; rr(g, -6, -21, 12, 6, 2); g.fill();
      g.fillStyle = '#fff'; g.font = '900 13px Arial'; g.textAlign='center'; g.fillText('⛽', 0, 5);
    } else {
      const sq = Math.abs(Math.cos(t*2.6 + k*0.7));
      g.scale(0.35 + sq*0.65, 1);
      g.fillStyle = '#e8a020'; g.beginPath(); g.arc(0,0,15,0,7); g.fill();
      g.fillStyle = '#ffd24a'; g.beginPath(); g.arc(0,0,11.5,0,7); g.fill();
      g.fillStyle = '#c98a10'; g.font='900 14px Arial'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText('★', 0, 1); g.textBaseline='alphabetic';
    }
    g.restore();
  }
}

function drawVehicle(g){
  const V = G.veh.V;
  // Anhänger zuerst (liegt hinten)
  if (G.veh.trailer){
    for (const w of G.veh.twheels){
      g.save(); g.translate(w.position.x, w.position.y); g.rotate(w.angle); drawWheel(g, w.spec.r); g.restore();
    }
    const t = G.veh.trailer;
    g.save(); g.translate(t.position.x, t.position.y); g.rotate(t.angle);
    DRAWERS[V.trailer.draw](g); g.restore();
  }
  for (const w of G.veh.wheels){
    g.save(); g.translate(w.position.x, w.position.y); g.rotate(w.angle); drawWheel(g, w.spec.r); g.restore();
  }
  const ch = G.veh.chassis;
  g.save(); g.translate(ch.position.x, ch.position.y); g.rotate(ch.angle);
  DRAWERS[V.draw](g); g.restore();
}

/* --- Kamera / Hauptbild --- */
function render(){
  const ch = G.veh.chassis;
  const anchorY = H*0.58;
  // beim hohen Sprung etwas herauszoomen
  const above = Math.max(0, terrainY(ch.position.x) - ch.position.y - 120);
  const viewT = Math.max(900, 620*(W/H)) * (1 + Math.min(0.45, above/1100));
  G.view += (viewT - G.view) * 0.05;
  const view  = G.view;
  const scale = W / view;

  const speedLead = Math.max(-60, Math.min(190, ch.velocity.x * 22));
  G.camX += ((ch.position.x + speedLead) - G.camX) * 0.12;
  G.camY += ((ch.position.y - 20) - G.camY) * 0.09;
  // Boden immer im Bild behalten
  const T = terrainY(G.camX);
  const minY = T - (H/scale)*0.42, maxY = T + (H/scale)*0.10;
  if (G.camY < minY) G.camY = minY;
  if (G.camY > maxY) G.camY = maxY;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky(ctx);
  drawFar(ctx, G.camX, G.camY, scale, anchorY);

  let shx = 0, shy = 0;
  if (G.shake > 0){ shx = (Math.random()-.5)*G.shake*30; shy = (Math.random()-.5)*G.shake*30; G.shake -= 0.03; }

  ctx.save();
  ctx.translate(W/2 + shx, anchorY + shy);
  ctx.scale(scale, scale);
  ctx.translate(-G.camX, -G.camY);

  drawGround(ctx, G.camX, view);
  drawItems(ctx, G.camX, view);
  drawVehicle(ctx);
  for (const p of G.particles){
    ctx.globalAlpha = Math.max(0, p.life/0.6);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

const sound = {
  on: localStorage.getItem('bergracer-sound') !== '0',
  ac:null, osc:null, gain:null, running:false,
  start(){
    if (!this.on || this.running) return;
    try {
      this.ac = this.ac || new (window.AudioContext||window.webkitAudioContext)();
      if (this.ac.state === 'suspended') this.ac.resume();
      this.osc = this.ac.createOscillator(); this.gain = this.ac.createGain();
      this.osc.type = 'sawtooth'; this.osc.frequency.value = 55;
      this.gain.gain.value = 0.0;
      this.osc.connect(this.gain); this.gain.connect(this.ac.destination);
      this.osc.start(); this.running = true;
    } catch(e){}
  },
  set(rpm, load){
    if (!this.running) return;
    const f = 42 + rpm*180;
    this.osc.frequency.setTargetAtTime(f, this.ac.currentTime, 0.06);
    this.gain.gain.setTargetAtTime(this.on ? (0.02 + load*0.05) : 0, this.ac.currentTime, 0.08);
  },
  stop(){ if (this.running){ try{ this.osc.stop(); }catch(e){} this.running = false; } }
};
document.getElementById('soundBtn').addEventListener('click', () => {
  sound.on = !sound.on;
  localStorage.setItem('bergracer-sound', sound.on ? '1':'0');
  document.getElementById('soundBtn').textContent = sound.on ? '🔊' : '🔇';
  if (!sound.on) sound.stop(); else if (G && !G.over) sound.start();
});

function bindPedal(el, key){
  const on  = e => { e.preventDefault(); input[key] = true;  el.classList.add('on'); };
  const off = e => { e.preventDefault(); input[key] = false; el.classList.remove('on'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  window.addEventListener('mouseup', off);
}
bindPedal(document.getElementById('gasPedal'), 'gas');
bindPedal(document.getElementById('brakePedal'), 'brake');

// Zusätzlich: linke/rechte Bildschirmhälfte
cv.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) setHalf(t.clientX, true);
}, {passive:true});
cv.addEventListener('touchend', e => {
  for (const t of e.changedTouches) setHalf(t.clientX, false);
}, {passive:true});
function setHalf(x, v){
  if (x < window.innerWidth/2){ input.brake = v; document.getElementById('brakePedal').classList.toggle('on', v); }
  else { input.gas = v; document.getElementById('gasPedal').classList.toggle('on', v); }
}
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowRight' || e.key === 'd') { input.gas = true; document.getElementById('gasPedal').classList.add('on'); }
  if (e.key === 'ArrowLeft'  || e.key === 'a') { input.brake = true; document.getElementById('brakePedal').classList.add('on'); }
  if (e.key === ' ' && G && G.over) againBtn.click();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowRight' || e.key === 'd') { input.gas = false; document.getElementById('gasPedal').classList.remove('on'); }
  if (e.key === 'ArrowLeft'  || e.key === 'a') { input.brake = false; document.getElementById('brakePedal').classList.remove('on'); }
});

      '<div class="vn">' + V.name + '</div>' +
      '<div class="vb">' + V.tag + '</div>' +
      '<div class="bars">' + bars(V.stats) + '</div>' +
      '<div class="vb" style="margin-top:4px">🏆 ' + bestOf(key) + ' m</div>';
    d.addEventListener('click', () => {
      selected = key; localStorage.setItem('bergracer-veh', key);
      [...vehGrid.children].forEach(c => c.classList.remove('sel'));
      d.classList.add('sel');
    });
    vehGrid.appendChild(d);
    drawPreview(d.querySelector('canvas'), key);
  }
  document.getElementById('totalCoins').textContent = totalCoins;
}
function bars(st){
  let h = '';
  const cls = ['', 'p', 'g'];
  for (let s=0; s<3; s++){
    for (let i=0;i<5;i++) h += '<i class="' + (i < st[s] ? 'on ' + cls[s] : '') + '"></i>';
    if (s<2) h += '<i style="background:transparent;width:6px"></i>';
  }
  return h;
}
function drawPreview(c, key){
  const V = VEHICLES[key], g = c.getContext('2d');
  const total = V.trailer ? V.chassis.w + V.trailer.w + 70 : V.chassis.w + 40;
  const s = Math.min(300/total, 0.92);
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,300,110);
  g.translate(150 + (V.trailer ? total*s*0.18 : 0), 74);
  g.scale(s, s);
  if (V.trailer){
    const T = V.trailer;
    const dx = V.trailer.hitchA.x - V.trailer.hitchB.x;
    g.save(); g.translate(dx, 6);
    for (const w of T.wheels){ g.save(); g.translate(w.x, w.y); drawWheel(g, w.r); g.restore(); }
    DRAWERS[T.draw](g); g.restore();
  }
  for (const w of V.wheels){ g.save(); g.translate(w.x, w.y); drawWheel(g, w.r); g.restore(); }
  DRAWERS[V.draw](g);
}

document.getElementById('startBtn').addEventListener('click', () => { sound.start(); startRun(selected); });
const againBtn = document.getElementById('againBtn');
againBtn.addEventListener('click', () => startRun(G.key));
document.getElementById('menuBtn').addEventListener('click', () => {
  overScreen.classList.add('hidden'); hud.classList.add('hidden'); pedals.classList.add('hidden');
  buildMenu(); startScreen.classList.remove('hidden');
});
buildMenu();

/* ==========================================================================
   14. SCHLEIFE
   ========================================================================== */
let last = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if (!G){ ctx.setTransform(DPR,0,0,DPR,0,0); drawSky(ctx); return; }
  const now = ts/1000;
  let dt = last ? Math.min(0.05, now - last) : 0;
  last = now;

  if (!G.over){
    acc += dt;
    let n = 0;
    while (acc >= 1/60 && n < 4){ step(1/60); acc -= 1/60; n++; if (G.over) break; }
    if (acc > 0.3) acc = 0;
    // Motorgeräusch
    const dw = G.veh.wheels.find(w => w.spec.drive);
    if (dw) sound.set(Math.min(1, Math.abs(dw.angularVelocity)/G.veh.V.maxW),
                      (input.gas||input.brake) && G.fuel>0 ? 1 : 0.35);
    updateHud();
  }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) toast.classList.remove('show'); }
  render();
}
requestAnimationFrame(loop);

// Startbild schon mal zeigen
ctx.setTransform(DPR,0,0,DPR,0,0); drawSky(ctx);
</script>
