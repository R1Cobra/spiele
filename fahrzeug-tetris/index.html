<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KMF Fahrzeug-Tetris</title>
<style>
  :root{
    --bg1:#0b1f3a; --bg2:#12325c; --panel:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12); --text:#eaf2ff; --muted:#9db4d6;
    --accent:#f7941d; --accent2:#29abe2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg1)) fixed;
    color:var(--text); min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:14px; gap:12px; user-select:none;
  }
  header{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;}
  .brand{
    background:#fff; border-radius:14px; padding:10px 16px 9px;
    box-shadow:0 10px 30px rgba(0,0,0,.4); max-width:360px; width:100%;
  }
  .brandlogo{display:block; width:100%; height:auto;}
  /* ---------- Zurück zur Spiele-Auswahl ---------- */
  .kmf-back{
    position:fixed; z-index:9999;
    top:calc(env(safe-area-inset-top, 0px) + 10px);
    left:calc(env(safe-area-inset-left, 0px) + 10px);
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 13px; border-radius:14px;
    font:700 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:#f1f5f9; text-decoration:none; white-space:nowrap;
    background:rgba(15,23,42,.72);
    border:1.5px solid rgba(255,255,255,.3);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
  }
  .kmf-back:active{ transform:scale(.94); }
  .kmfbar{display:flex; gap:5px; margin-top:8px;}
  .kmfbar span{flex:1; height:5px; border-radius:3px;}
  .kmfbar span:nth-child(1){background:#e2001a;}
  .kmfbar span:nth-child(2){background:#ffd400;}
  .kmfbar span:nth-child(3){background:#12a150;}
  header h1{font-size:18px;margin:0;letter-spacing:.3px;}
  header h1 span{color:var(--accent);}
  .game{
    display:flex; gap:16px; align-items:flex-start;
    width:100%; max-width:640px; justify-content:center;
  }
  .board-wrap{position:relative;}
  canvas#board{
    background:linear-gradient(180deg,#0a1830,#0d2244);
    border-radius:14px; border:1px solid var(--line);
    box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.03);
    display:block; height:70vh; max-height:640px; width:auto; touch-action:none;
  }
  .side{display:flex; flex-direction:column; gap:12px; min-width:120px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px; backdrop-filter:blur(6px);
  }
  .card h2{margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted);}
  .stat{font-size:26px; font-weight:800; line-height:1;}
  .stat.small{font-size:20px;}
  canvas#next{display:block; width:100%; height:auto; background:rgba(0,0,0,.18); border-radius:10px;}
  .controls{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    width:100%; max-width:360px;
  }
  .btn{
    -webkit-appearance:none; border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    color:var(--text); font-size:22px; font-weight:700;
    padding:16px 0; border-radius:14px; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25); transition:transform .05s, background .15s;
  }
  .btn:active{transform:translateY(2px); background:rgba(247,148,29,.25);}
  .btn.wide{grid-column:span 4; font-size:16px; padding:12px 0;}
  .hint{font-size:11px;color:var(--muted);text-align:center;max-width:360px;line-height:1.5;}
  .overlay{
    position:absolute; inset:0; border-radius:14px;
    background:rgba(6,16,32,.82); backdrop-filter:blur(4px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:20px; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .overlay h3{margin:0; font-size:26px;}
  .overlay p{margin:0; color:var(--muted); font-size:14px;}
  .overlay .big{font-size:40px; font-weight:900; color:var(--accent);}
  .play{
    background:linear-gradient(135deg,var(--accent),#ffbf66); color:#0b1f3a;
    border:none; font-weight:900; font-size:18px; padding:14px 28px; border-radius:14px;
    cursor:pointer; box-shadow:0 8px 22px rgba(247,148,29,.4);
  }
  .play:active{transform:translateY(2px);}
  @media (max-width:560px){
    header h1{font-size:17px;}
    canvas#board{height:62vh;}
    .side{min-width:96px;}
    .stat{font-size:22px;}
  }
</style>
</head>

<script>
(() => {
  "use strict";
  const COLS = 10, ROWS = 20, CELL = 34;

  // Code je Feld = [Art][Rolle][Richtung]
  //   Art:    c = Auto,  k = Lastwagen
  //   Rolle:  v = Fahrzeug (zieht) | t = Anhänger | f = Auflieger vorne | r = Auflieger hinten
  //   Richtung: h = waagrecht (Front links),  v = senkrecht (Front oben)
  const P = {
    I:{ color:"#29abe2", m:[["kvh","kth","cvh","cth"]] },          // LKW+Auflieger, Auto+Anhänger
    O:{ color:"#f7941d", m:[["cvh","cth"],["cvh","cth"]] },        // 2x Auto+Anhänger (Würfel)
    S:{ color:"#8cc63f", m:[[0,"cvh","cth"],["cvh","cth",0]] },    // 2 Paare versetzt
    Z:{ color:"#ed4c4c", m:[["cvh","cth",0],[0,"cvh","cth"]] },    // gespiegelt
    L:{ color:"#fbbf3b", m:[[0,0,"cvh"],["kvh","kfh","krh"]] },              // LKW (3 quer) + PKW-Solo oben rechts = L (4 Felder)
    J:{ color:"#3b6fd6", m:[["cvh",0,0],["kvh","kfh","krh"]] },              // gespiegelt = J (4 Felder)
    W:{ color:"#a06cd5", m:[["kvh","kth"],["cvh","cth"]] },        // LKW-Paar + Auto-Paar (Würfel)
    T:{ color:"#e0518a", m:[[0,"mri",0],["mfr","mbo","mre"]] },    // T-Stück = Motorrad (unten Bike, oben Fahrer)
  };
  function decode(code,color){
    if(!code) return 0;
    if(code[0]==="m") return { color, kind:"moto", role:"M", part: code.slice(1), o:0 };  // mfr/mbo/mre/mri
    const rc=code[1];
    const role = rc==="v" ? "V" : "T";
    const part = role==="V" ? null : (rc==="f"?"front": rc==="r"?"rear":"solo");
    // o = Ausrichtung in Vierteldrehungen (0 = quer/Front links, 1 = hochkant). Dreht sich mit dem Stück.
    return { color, kind: code[0]==="k"?"truck":"car", role, part, o: code[2]==="v"?1:0 };
  }
  const KEYS = Object.keys(P);

  const canvas=document.getElementById("board"), ctx=canvas.getContext("2d");
  const nextCv=document.getElementById("next"), nctx=nextCv.getContext("2d");
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));

  canvas.style.aspectRatio=COLS+" / "+ROWS; ctx.scale(dpr,dpr);
  nextCv.width=120*dpr; nextCv.height=120*dpr; nctx.scale(dpr,dpr);

  let board,current,next,score=0,best=0,level=1,lines=0,running,paused,over;
  const lsGet=(k)=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };

  const ui={score:el("score"),best:el("best"),level:el("level"),lines:el("lines")};
  const emptyBoard=()=>Array.from({length:ROWS},()=>Array(COLS).fill(null));

  // ---- Ton-Engine (Web Audio, komplett eingebaut) ----
  const Sound = (()=>{
    let ctx=null, on=(lsGet("kmf_tetris_sound")!=="0");
    function ensure(){
      if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
      if(ctx.state==="suspended") ctx.resume();
    }
    function tone(freq,dur,type,vol,when){
      if(!on||!ctx) return;
      const t=ctx.currentTime+(when||0);
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type||"square"; o.frequency.setValueAtTime(freq,t);

      g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.03);
    }
    return {
      resume:ensure,
      isOn:()=>on,
      toggle(){ on=!on; lsSet("kmf_tetris_sound",on?"1":"0"); if(on){ ensure(); tone(660,0.08,"triangle",0.12); } return on; },
      move(){ tone(200,0.045,"square",0.05); },
      rotate(){ tone(340,0.06,"square",0.07); },
      drop(){ tone(150,0.09,"sawtooth",0.10); tone(90,0.13,"sine",0.09,0.02); },
      clear(n){ const notes=[523,659,784,1046,1319]; const cnt=Math.min(n+2,5);
        for(let i=0;i<cnt;i++) tone(notes[i],0.13,"triangle",0.13,i*0.06);
        if(n>=4){ tone(1568,0.25,"triangle",0.12,0.30); } },
      level(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.12,"triangle",0.11,i*0.08)); },
      over(){ [440,392,349,262].forEach((f,i)=>tone(f,0.28,"sawtooth",0.12,i*0.15)); },
    };
  })();

  // ---- Musik-Engine (Web Audio, eigene Melodien – Tetris-angelehnt, nicht kopiert) ----
  // Jede Stufe: {name,tempo(BPM),leadWave,leadVol,bassWave,bassVol, lead[[midi,beats]], bass[[...]]}
  // midi 0 = Pause. Lead + Bass laufen als Endlos-Schleife (je 32 Beats, bleiben synchron).
  const Music = (()=>{
    const mtof=m=>440*Math.pow(2,(m-69)/12);
    const STYLES=[
      { name:"Folk", tempo:150, leadWave:"square", leadVol:0.07, bassWave:"triangle", bassVol:0.06,
        lead:[[76,1],[71,.5],[72,.5],[74,1],[72,.5],[71,.5], [69,1],[69,.5],[72,.5],[76,1],[74,.5],[72,.5],
              [71,1.5],[72,.5],[74,1],[76,1], [72,1],[69,1],[69,1],[0,1],
              [0,.5],[74,1],[77,.5],[81,1],[79,.5],[77,.5], [76,1.5],[72,.5],[76,1],[74,.5],[72,.5],
              [71,1],[71,.5],[72,.5],[74,1],[76,1], [72,1],[69,1],[69,1],[0,1]],
        bass:[[45,2],[52,2], [45,2],[52,2], [40,2],[47,2], [45,2],[52,2],
              [50,2],[45,2], [45,2],[52,2], [40,2],[47,2], [45,2],[52,2]] },
      { name:"Chill", tempo:100, leadWave:"triangle", leadVol:0.06, bassWave:"sine", bassVol:0.07,
        lead:[[76,1],[79,1],[72,2], [74,1],[77,1],[69,2], [72,1],[76,1],[79,2], [71,1],[74,1],[67,2],
              [69,1],[72,1],[76,2], [67,1],[71,1],[74,2], [77,1],[76,1],[72,2], [76,1],[74,1],[72,2]],
        bass:[[36,4],[45,4],[36,4],[43,4], [45,4],[43,4],[41,4],[36,4]] },
      { name:"Arcade", tempo:165, leadWave:"square", leadVol:0.06, bassWave:"square", bassVol:0.05,
        lead:[[72,.5],[76,.5],[79,.5],[84,.5],[79,.5],[76,.5],[72,1],
              [74,.5],[77,.5],[81,.5],[74,.5],[81,.5],[77,.5],[74,1],
              [76,.5],[79,.5],[83,.5],[76,.5],[71,.5],[79,.5],[76,1],
              [79,1],[77,.5],[76,.5],[74,1],[67,1],
              [72,.5],[76,.5],[79,.5],[84,.5],[79,.5],[76,.5],[72,1],
              [69,.5],[72,.5],[76,.5],[81,.5],[76,.5],[72,.5],[69,1],
              [77,.5],[81,.5],[84,.5],[77,.5],[84,.5],[81,.5],[77,1],
              [79,1],[71,1],[74,1],[79,1]],
        bass:[[36,1],[48,1],[36,1],[48,1], [38,1],[50,1],[38,1],[50,1],
              [40,1],[52,1],[40,1],[52,1], [43,1],[55,1],[43,1],[55,1],
              [36,1],[48,1],[36,1],[48,1], [45,1],[57,1],[45,1],[57,1],
              [41,1],[53,1],[41,1],[53,1], [43,1],[55,1],[43,1],[55,1]] },
    ];
    let ctx=null, master=null, timer=null, playing=false;
    let sel=parseInt(lsGet("kmf_tetris_music")||"1",10);
    if(!Number.isFinite(sel)||sel<0||sel>STYLES.length) sel=1;
    let leadP=0,bassP=0,leadTime=0,bassTime=0;
    function ensure(){
      if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; }
        master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); }
      if(ctx.state==="suspended") ctx.resume();
      return !!ctx;
    }
    function voice(freq,dur,type,vol,when){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,when);
      g.gain.setValueAtTime(0.0001,when);
      g.gain.exponentialRampToValueAtTime(vol,when+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
      o.connect(g); g.connect(master); o.start(when); o.stop(when+dur+0.03);
    }
    function schedule(){
      if(!playing||!ctx||sel===0) return;
      const st=STYLES[sel-1], beat=60/st.tempo, ahead=ctx.currentTime+0.15;
      while(leadTime<ahead){ const p=st.lead[leadP]; if(p[0]>0) voice(mtof(p[0]),p[1]*beat*0.85,st.leadWave,st.leadVol,leadTime); leadTime+=p[1]*beat; leadP=(leadP+1)%st.lead.length; }
      while(bassTime<ahead){ const p=st.bass[bassP]; if(p[0]>0) voice(mtof(p[0]),p[1]*beat*0.9,st.bassWave,st.bassVol,bassTime); bassTime+=p[1]*beat; bassP=(bassP+1)%st.bass.length; }
    }
    function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
    function beginPlayback(){
      if(sel===0) return;
      if(!ensure()) return;
      stopTimer();
      master.gain.setValueAtTime(0.9,ctx.currentTime);
      playing=true; leadP=0; bassP=0; leadTime=bassTime=ctx.currentTime+0.1;
      timer=setInterval(schedule,40); schedule();
    }
    function stopPlayback(){ playing=false; stopTimer(); if(master&&ctx){ try{ master.gain.setTargetAtTime(0.0001,ctx.currentTime,0.05); }catch(e){} } }
    return {
      resume:ensure,
      label:()=> sel===0 ? "Aus" : STYLES[sel-1].name,
      cycle(){ sel=(sel+1)%(STYLES.length+1); lsSet("kmf_tetris_music",String(sel));
               if(sel===0) stopPlayback(); else beginPlayback(); return this.label(); },
      start(){ beginPlayback(); },
      stop(){ stopPlayback(); },
    };
  })();

  // "Beutel"-Zufall: alle Stücke gemischt je einmal ziehen, dann neu mischen → gute Durchmischung, keine langen Serien
  let bag=[];
  function nextFromBag(){
    if(bag.length===0){ bag=KEYS.slice();
      for(let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=bag[i]; bag[i]=bag[j]; bag[j]=t; } }
    return bag.pop();
  }
  function rndPiece(){
    const t=nextFromBag();
    const spec=P[t];
    const m=spec.m.map(row=>row.map(code=>decode(code,spec.color)));
    return { type:t, color:spec.color, m, row:0, col:Math.floor((COLS-m[0].length)/2) };
  }
  function rotate(mat){
    const h=mat.length,w=mat[0].length;
    const res=Array.from({length:w},()=>Array(h).fill(0));
    for(let r=0;r<h;r++)for(let c=0;c<w;c++){
      const cell=mat[r][c];
      res[c][h-1-r]= cell ? {color:cell.color,kind:cell.kind,role:cell.role,part:cell.part,o:((cell.o||0)+1)%4} : 0;
    }
    return res;
  }
  function collide(m,row,col){
    for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){
      if(!m[r][c]) continue;
      const br=row+r,bc=col+c;
      if(bc<0||bc>=COLS||br>=ROWS) return true;
      if(br>=0&&board[br][bc]) return true;
    }
    return false;
  }
  function tryRotate(){
    const m=rotate(current.m);
    for(const k of [0,-1,1,-2,2]){ if(!collide(m,current.row,current.col+k)){ current.m=m; current.col+=k; Sound.rotate(); return; } }
  }
  const move=dx=>{ if(!collide(current.m,current.row,current.col+dx)){ current.col+=dx; Sound.move(); } };
  function softDrop(){ if(!collide(current.m,current.row+1,current.col)){ current.row++; return true; } lockPiece(); return false; }
  function hardDrop(){ let d=0; while(!collide(current.m,current.row+1,current.col)){ current.row++; d++; } score+=d*2; lockPiece(); }

  function lockPiece(){
    for(let r=0;r<current.m.length;r++)for(let c=0;c<current.m[r].length;c++){
      if(current.m[r][c]){
        const br=current.row+r,bc=current.col+c;
        if(br<0){ gameOver(); return; }
        board[br][bc]=current.m[r][c];
      }
    }
    Sound.drop();
    clearLines();
    current=next; next=rndPiece(); drawNext();
    if(collide(current.m,current.row,current.col)) gameOver();
  }
  function clearLines(){
    let cleared=0;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r].every(v=>v)){ board.splice(r,1); board.unshift(Array(COLS).fill(null)); cleared++; r++; }
    }
    if(cleared){ const oldLevel=level; score+=[0,100,300,500,800][cleared]*level; lines+=cleared; level=Math.floor(lines/10)+1;
      Sound.clear(cleared); if(level>oldLevel) Sound.level(); updateUI(); }
  }
  const dropInterval=()=>Math.max(90,800-(level-1)*70);
  function updateUI(){ ui.score.textContent=score; ui.best.textContent=best; ui.level.textContent=level; ui.lines.textContent=lines; }

  // ---- Farb-Helfer ----
  const clamp=v=>Math.max(0,Math.min(255,v));
  const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
  const toHex=(r,g,b)=>"#"+[r,g,b].map(v=>clamp(Math.round(v)).toString(16).padStart(2,"0")).join("");
  const lighten=(h,p)=>{const[r,g,b]=hexToRgb(h);return toHex(r+(255-r)*p/100,g+(255-g)*p/100,b+(255-b)*p/100);};
  const darken =(h,p)=>{const[r,g,b]=hexToRgb(h);return toHex(r*(1-p/100),g*(1-p/100),b*(1-p/100));};
  function roundRect(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
    g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  function ellipse(g,cx,cy,rx,ry){ g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,7); g.fill(); }
  function bodyGrad(g,color,y0,y1){ const gr=g.createLinearGradient(0,y0,0,y1);
    gr.addColorStop(0,lighten(color,26)); gr.addColorStop(0.6,color); gr.addColorStop(1,darken(color,14)); return gr; }
  function drawWheel(g,cx,cy,r){
    g.fillStyle="#121a24"; g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
    g.fillStyle="#b9c4d4"; g.beginPath(); g.arc(cx,cy,r*0.5,0,7); g.fill();
    g.fillStyle="#5b6a7d"; g.beginPath(); g.arc(cx,cy,r*0.2,0,7); g.fill();
  }

  // ---- Fahrzeug-Sprites (Seitenansicht, Front links) ----
  function drawCar(g,x,y,s,color){
    g.fillStyle="rgba(0,0,0,0.22)"; ellipse(g,x+s*0.50,y+s*0.85,s*0.40,s*0.065);
    g.fillStyle=bodyGrad(g,color,y+s*0.46,y+s*0.80);
    roundRect(g,x+s*0.06,y+s*0.48,s*0.88,s*0.30,s*0.12); g.fill();
    g.fillStyle=bodyGrad(g,lighten(color,6),y+s*0.28,y+s*0.54);
    g.beginPath();
    g.moveTo(x+s*0.28,y+s*0.52);
    g.quadraticCurveTo(x+s*0.36,y+s*0.28,x+s*0.52,y+s*0.28);
    g.lineTo(x+s*0.64,y+s*0.28);
    g.quadraticCurveTo(x+s*0.78,y+s*0.30,x+s*0.80,y+s*0.52);
    g.closePath(); g.fill();
    g.fillStyle="rgba(216,240,255,0.92)";
    roundRect(g,x+s*0.33,y+s*0.33,s*0.14,s*0.15,s*0.03); g.fill();
    roundRect(g,x+s*0.50,y+s*0.33,s*0.20,s*0.15,s*0.03); g.fill();
    g.fillStyle="rgba(255,238,170,0.95)"; roundRect(g,x+s*0.05,y+s*0.55,s*0.06,s*0.10,s*0.02); g.fill();
    g.fillStyle="rgba(255,90,90,0.95)"; roundRect(g,x+s*0.89,y+s*0.55,s*0.06,s*0.10,s*0.02); g.fill();
    drawWheel(g,x+s*0.28,y+s*0.80,s*0.13); drawWheel(g,x+s*0.72,y+s*0.80,s*0.13);
  }
  function drawTrailer(g,x,y,s,color){
    g.fillStyle="rgba(0,0,0,0.22)"; ellipse(g,x+s*0.54,y+s*0.86,s*0.36,s*0.06);
    g.strokeStyle="#2a3a4d"; g.lineWidth=s*0.05; g.lineCap="round";
    g.beginPath(); g.moveTo(x+s*0.02,y+s*0.64); g.lineTo(x+s*0.22,y+s*0.58); g.stroke();
    g.fillStyle="#2a3a4d"; g.beginPath(); g.arc(x+s*0.04,y+s*0.64,s*0.045,0,7); g.fill();
    g.fillStyle=bodyGrad(g,color,y+s*0.30,y+s*0.72);
    roundRect(g,x+s*0.16,y+s*0.30,s*0.74,s*0.42,s*0.06); g.fill();
    g.fillStyle="rgba(255,255,255,0.16)"; roundRect(g,x+s*0.20,y+s*0.44,s*0.66,s*0.08,s*0.03); g.fill();
    drawWheel(g,x+s*0.46,y+s*0.76,s*0.115); drawWheel(g,x+s*0.62,y+s*0.76,s*0.115);
  }
  // Sattelschlepper (Zugmaschine, Front links) – 1 Feld
  function drawTractor(g,x,y,s,color){
    g.fillStyle="rgba(0,0,0,0.20)"; ellipse(g,x+s*0.62,y+s*0.87,s*0.82,s*0.05);
    // langes Fahrgestell (reicht unter den Auflieger)
    g.fillStyle=bodyGrad(g,darken(color,14),y+s*0.60,y+s*0.80);
    roundRect(g,x+s*0.04,y+s*0.60,s*1.44,s*0.18,s*0.05); g.fill();
    // Motorhaube
    g.fillStyle=bodyGrad(g,color,y+s*0.44,y+s*0.74);
    roundRect(g,x+s*0.02,y+s*0.44,s*0.30,s*0.32,s*0.06); g.fill();
    // Kabine (etwas grösser)
    g.fillStyle=bodyGrad(g,lighten(color,10),y+s*0.20,y+s*0.64);
    roundRect(g,x+s*0.24,y+s*0.20,s*0.34,s*0.44,s*0.07); g.fill();
    g.fillStyle="rgba(216,240,255,0.92)"; roundRect(g,x+s*0.27,y+s*0.26,s*0.26,s*0.24,s*0.04); g.fill();
    // Sattelkupplung
    g.fillStyle=darken(color,22); roundRect(g,x+s*0.60,y+s*0.56,s*0.55,s*0.06,s*0.02); g.fill();
    g.fillStyle="rgba(255,238,170,0.95)"; roundRect(g,x+s*0.02,y+s*0.56,s*0.05,s*0.09,s*0.02); g.fill();
    // Räder: vorne + Tandem hinten (weiter hinten unter dem Auflieger)
    drawWheel(g,x+s*0.20,y+s*0.80,s*0.14);
    drawWheel(g,x+s*1.16,y+s*0.80,s*0.135);
    drawWheel(g,x+s*1.36,y+s*0.80,s*0.135);
  }
  // Auflieger (Sattelanhänger) – 1 Feld, mehrere verschmelzen zu einem langen Aufbau
  function drawAuflieger(g,x,y,s,color,isFront,isRear,onTractor){
    // Auflieger-Vorderteil liegt auf dem Schlepper auf (nach vorne über die Sattelkupplung ziehen)
    const x0=x-(isFront?(onTractor?s*0.40:0):s*0.06), x1=x+s+(isRear?0:s*0.06);
    g.fillStyle="rgba(0,0,0,0.20)"; ellipse(g,(x0+x1)/2,y+s*0.80,(x1-x0)*0.5,s*0.05);
    g.fillStyle=bodyGrad(g,color,y+s*0.14,y+s*0.68);
    roundRect(g,x0,y+s*0.14,x1-x0,s*0.54,s*0.05); g.fill();
    g.fillStyle="rgba(255,255,255,0.16)"; roundRect(g,x0+s*0.05,y+s*0.36,(x1-x0)-s*0.10,s*0.09,s*0.03); g.fill();
    if(isFront&&!onTractor){
      g.strokeStyle="#2a3a4d"; g.lineWidth=s*0.04; g.lineCap="round";
      g.beginPath(); g.moveTo(x+s*0.20,y+s*0.68); g.lineTo(x+s*0.20,y+s*0.82); g.stroke();
    }
    if(isRear){
      g.strokeStyle=darken(color,22); g.lineWidth=s*0.03;
      g.beginPath(); g.moveTo(x+s*0.84,y+s*0.18); g.lineTo(x+s*0.84,y+s*0.64); g.stroke();
      // kurzer Auflieger direkt auf dem Schlepper: Tandem des Schleppers reicht, keine Doppel-Räder
      if(!(isFront&&onTractor)){ drawWheel(g,x+s*0.42,y+s*0.74,s*0.13); drawWheel(g,x+s*0.62,y+s*0.74,s*0.13); }
    }
  }

  // ---- Motorrad (T-Stück): 3 Felder unten = Bike (Vorderrad|Motor|Hinterrad), Feld oben Mitte = Fahrer ----
  function drawMoto(g,x,y,s,color,part){
    if(part==="fr"||part==="re") drawMotoWheel(g,x,y,s,color,part==="fr");
    else if(part==="bo") drawMotoBody(g,x,y,s,color);
    else drawMotoRider(g,x,y,s,color);
  }
  function drawMotoWheel(g,x,y,s,color,isFront){
    const cx=x+s*0.5, cy=y+s*0.66, r=s*0.27;
    g.fillStyle="rgba(0,0,0,0.20)"; ellipse(g,cx,y+s*0.92,s*0.34,s*0.05);
    g.strokeStyle=color; g.lineWidth=s*0.11; g.lineCap="round";
    g.beginPath(); g.arc(cx,cy,r+s*0.05,Math.PI*1.02,Math.PI*1.98); g.stroke();   // Kotflügel
    drawWheel(g,cx,cy,r);
    g.strokeStyle=darken(color,10); g.lineWidth=s*0.07; g.lineCap="round";
    if(isFront){ // Vorderrad links: Rahmen nach rechts zum Motor, Scheinwerfer vorne
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(x+s*0.98,y+s*0.44); g.stroke();
      g.fillStyle="rgba(255,238,170,0.95)"; g.beginPath(); g.arc(x+s*0.10,y+s*0.40,s*0.07,0,7); g.fill();
    } else { // Hinterrad rechts: Rahmen nach links zum Motor, Rücklicht hinten
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(x+s*0.02,y+s*0.44); g.stroke();
      g.fillStyle="rgba(255,90,90,0.95)"; roundRect(g,x+s*0.86,y+s*0.37,s*0.08,s*0.11,s*0.02); g.fill();
    }
  }
  function drawMotoBody(g,x,y,s,color){
    g.fillStyle="rgba(0,0,0,0.18)"; ellipse(g,x+s*0.5,y+s*0.90,s*0.44,s*0.05);
    g.strokeStyle=darken(color,14); g.lineWidth=s*0.09; g.lineCap="round";
    g.beginPath(); g.moveTo(x-s*0.06,y+s*0.60); g.lineTo(x+s*1.06,y+s*0.60); g.stroke();  // Rahmen zu beiden Rädern
    g.fillStyle=bodyGrad(g,darken(color,8),y+s*0.46,y+s*0.70);
    roundRect(g,x+s*0.20,y+s*0.46,s*0.60,s*0.22,s*0.05); g.fill();                        // Motorblock
    g.fillStyle=bodyGrad(g,lighten(color,10),y+s*0.30,y+s*0.52);
    roundRect(g,x+s*0.20,y+s*0.32,s*0.40,s*0.20,s*0.09); g.fill();                        // Tank (vorne/links)
    g.fillStyle="#1c2733"; roundRect(g,x+s*0.54,y+s*0.34,s*0.34,s*0.12,s*0.05); g.fill(); // Sitz (hinten/rechts)
    g.strokeStyle=darken(color,20); g.lineWidth=s*0.05; g.lineCap="round";
    g.beginPath(); g.moveTo(x+s*0.30,y+s*0.40); g.lineTo(x+s*0.14,y+s*0.24); g.stroke();  // Lenker vorne
  }
  function drawMotoRider(g,x,y,s,color){
    g.fillStyle="#2c3e50"; roundRect(g,x+s*0.30,y+s*0.64,s*0.42,s*0.30,s*0.11); g.fill(); // Beine/Hose
    g.fillStyle=bodyGrad(g,color,y+s*0.34,y+s*0.72);                                       // Jacke
    g.beginPath();
    g.moveTo(x+s*0.64,y+s*0.72);
    g.quadraticCurveTo(x+s*0.72,y+s*0.44,x+s*0.50,y+s*0.42);
    g.lineTo(x+s*0.42,y+s*0.44);
    g.quadraticCurveTo(x+s*0.30,y+s*0.56,x+s*0.34,y+s*0.72);
    g.closePath(); g.fill();
    g.strokeStyle=darken(color,8); g.lineWidth=s*0.11; g.lineCap="round";
    g.beginPath(); g.moveTo(x+s*0.46,y+s*0.50); g.lineTo(x+s*0.22,y+s*0.72); g.stroke();   // Arm zum Lenker
    g.fillStyle="#e9edf3"; g.beginPath(); g.arc(x+s*0.46,y+s*0.32,s*0.16,0,7); g.fill();    // Helm
    g.fillStyle="rgba(30,40,55,0.92)"; g.beginPath(); g.arc(x+s*0.42,y+s*0.33,s*0.12,Math.PI*0.6,Math.PI*1.5); g.fill(); // Visier
  }

  // ---- Fahrzeug pro Feld zeichnen (Ausrichtung dreht sich als Ganzes mit dem Stück mit) ----
  function drawCellVehicle(g,grid,r,c,s,ox,oy){
    const cell=grid[r][c]; if(!cell) return;
    const color=cell.color, x=ox+c*s, y=oy+r*s;
    let fn;
    if(cell.kind==="moto"){
      fn=(gg,xx,yy,ss)=>drawMoto(gg,xx,yy,ss,color,cell.part);
    } else if(cell.kind==="truck"){
      if(cell.role==="V") fn=(gg,xx,yy,ss)=>drawTractor(gg,xx,yy,ss,color);
      else {
        // Auflieger: front verbindet nach hinten, rear hat Räder, solo = kurz
        const f = cell.part==="front" ? [true,false,true]
                : cell.part==="rear"  ? [false,true,false]
                : [true,true,true];
        fn=(gg,xx,yy,ss)=>drawAuflieger(gg,xx,yy,ss,color,f[0],f[1],f[2]);
      }
    } else {
      fn = cell.role==="V" ? (gg,xx,yy,ss)=>drawCar(gg,xx,yy,ss,color)
                           : (gg,xx,yy,ss)=>drawTrailer(gg,xx,yy,ss,color);
    }
    const o=cell.o||0;  // 0..3 Vierteldrehungen im Uhrzeigersinn
    if(o){ g.save(); g.translate(x+s/2,y+s/2); g.rotate(o*Math.PI/2); g.translate(-s/2,-s/2); fn(g,0,0,s); g.restore(); }
    else fn(g,x,y,s);
    // Farbige Umrandung pro Klotz – zeigt die Struktur (wichtig beim Linien-Füllen/Wegplatzen)
    g.strokeStyle=lighten(color,32); g.lineWidth=Math.max(1.5,s*0.05); g.globalAlpha=0.9;
    roundRect(g,x+s*0.045,y+s*0.045,s*0.91,s*0.91,s*0.16); g.stroke(); g.globalAlpha=1;
  }
  function renderVehicles(g,grid){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]) drawCellVehicle(g,grid,r,c,CELL,0,0);
  }
  function compositeGrid(){
    const t=board.map(row=>row.slice());
    if(current){
      for(let r=0;r<current.m.length;r++)for(let c=0;c<current.m[r].length;c++){
        if(current.m[r][c]){ const br=current.row+r,bc=current.col+c;
          if(br>=0&&br<ROWS&&bc>=0&&bc<COLS) t[br][bc]=current.m[r][c]; }
      }
    }
    return t;
  }
  function drawPieceOutline(g){
    const m=current.m,row=current.row,col=current.col;
    const inside=(r,c)=> r>=0&&r<m.length&&c>=0&&c<m[0].length&&m[r][c];
    g.strokeStyle=lighten(current.color,35); g.lineWidth=2.5; g.lineJoin="round"; g.globalAlpha=0.85; g.beginPath();
    for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){
      if(!m[r][c]) continue;
      const x=(col+c)*CELL, y=(row+r)*CELL;
      if(!inside(r-1,c)){ g.moveTo(x+1,y+1); g.lineTo(x+CELL-1,y+1); }
      if(!inside(r+1,c)){ g.moveTo(x+1,y+CELL-1); g.lineTo(x+CELL-1,y+CELL-1); }
      if(!inside(r,c-1)){ g.moveTo(x+1,y+1); g.lineTo(x+1,y+CELL-1); }
      if(!inside(r,c+1)){ g.moveTo(x+CELL-1,y+1); g.lineTo(x+CELL-1,y+CELL-1); }
    }
    g.stroke(); g.globalAlpha=1;
  }

  function draw(){
    ctx.clearRect(0,0,COLS*CELL,ROWS*CELL);
    ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
    for(let c=1;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,ROWS*CELL); ctx.stroke(); }
    for(let r=1;r<ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(COLS*CELL,r*CELL); ctx.stroke(); }
    if(current){
      let gr=current.row;
      while(!collide(current.m,gr+1,current.col)) gr++;
      ctx.globalAlpha=0.14; ctx.fillStyle=current.color;
      for(let r=0;r<current.m.length;r++)for(let c=0;c<current.m[r].length;c++){
        if(current.m[r][c]){ roundRect(ctx,(current.col+c)*CELL+4,(gr+r)*CELL+4,CELL-8,CELL-8,7); ctx.fill(); }
      }
      ctx.globalAlpha=1;
    }
    renderVehicles(ctx, compositeGrid());
    if(current) drawPieceOutline(ctx);
  }

  function drawNext(){
    nctx.clearRect(0,0,120,120);
    if(!next) return;
    const m=next.m, nr=m.length, nc=m[0].length;
    const cs=Math.min(30, Math.floor(108/Math.max(nr,nc)));
    const w=nc*cs, h=nr*cs, ox=(120-w)/2, oy=(120-h)/2;
    for(let r=0;r<nr;r++)for(let c=0;c<nc;c++) if(m[r][c]) drawCellVehicle(nctx,m,r,c,cs,ox,oy);
  }

  // ---- Loop ----
  let lastTime=0, acc=0, rafId=null;
  function loop(t){
    rafId=requestAnimationFrame(loop);
    if(!running||paused||over) return;
    const dt=t-lastTime; lastTime=t; acc+=dt;
    if(acc>=dropInterval()){ softDrop(); acc=0; updateUI(); }
    draw();
  }

  function startGame(){
    Sound.resume(); Music.resume(); Music.start();
    board=emptyBoard(); score=0; level=1; lines=0; over=false; paused=false; running=true;
    bag=[]; current=rndPiece(); next=rndPiece();
    updateUI(); drawNext(); hideOverlay();
    lastTime=performance.now(); acc=0;
    if(!rafId) rafId=requestAnimationFrame(loop);
  }
  function gameOver(){
    over=true; running=false; Music.stop(); Sound.over();
    if(score>best){ best=score; lsSet("kmf_tetris_best",String(best)); }
    updateUI(); showOverlay("Game Over","Dein Ergebnis:",score,"Nochmal spielen");
  }
  function togglePause(){
    if(!running||over) return;
    paused=!paused;
    if(paused){ showOverlay("Pause","Weiter geht's, wenn du bereit bist.",null,"Weiter"); Music.stop(); }
    else { hideOverlay(); lastTime=performance.now(); Music.start(); }
  }
  const overlay=el("overlay"),ovTitle=el("ov-title"),ovText=el("ov-text"),ovScore=el("ov-score"),ovBtn=el("ov-btn");
  function showOverlay(title,text,scoreVal,btn){
    ovTitle.textContent=title; ovText.innerHTML=text;
    if(scoreVal===null) ovScore.style.display="none"; else { ovScore.style.display="block"; ovScore.textContent=scoreVal; }
    ovBtn.textContent=btn; overlay.classList.add("show");
  }
  function hideOverlay(){ overlay.classList.remove("show"); }
  ovBtn.addEventListener("click",()=>{ if(paused&&!over) togglePause(); else startGame(); });

  document.addEventListener("keydown",e=>{
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
    if(!running||over){ if(e.key===" ") startGame(); return; }
    if(paused){ if(e.key==="p"||e.key==="P") togglePause(); return; }
    switch(e.key){
      case "ArrowLeft": move(-1); draw(); break;
      case "ArrowRight": move(1); draw(); break;
      case "ArrowUp": tryRotate(); draw(); break;
      case "ArrowDown": softDrop(); acc=0; updateUI(); draw(); break;
      case " ": if(!e.repeat){ hardDrop(); acc=0; updateUI(); draw(); } break;
      case "p": case "P": togglePause(); break;
    }
  });

  function hold(id,fn,repeat){
    const b=el(id); let iv=null;
    const start=e=>{ e.preventDefault(); if(iv){clearInterval(iv);iv=null;} if(!running||paused||over) return; fn();
      if(repeat) iv=setInterval(()=>{ if(running&&!paused&&!over) fn(); },95); };
    const stop=()=>{ if(iv){clearInterval(iv); iv=null;} };
    b.addEventListener("touchstart",start,{passive:false});
    b.addEventListener("mousedown",start);
    ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev,stop));
  }
  hold("c-left",()=>{move(-1);draw();},true);
  hold("c-right",()=>{move(1);draw();},true);
  hold("c-down",()=>{softDrop();acc=0;updateUI();draw();},true);
  el("c-rot").addEventListener("click",()=>{ if(running&&!paused&&!over){tryRotate();draw();} });
  el("c-drop").addEventListener("click",()=>{ if(running&&!paused&&!over){hardDrop();acc=0;updateUI();draw();} });
  el("c-pause").addEventListener("click",togglePause);
  const soundBtn=el("c-sound");
  function refreshSoundBtn(){ soundBtn.textContent = Sound.isOn() ? "🔊 Ton" : "🔇 Ton aus"; }
  soundBtn.addEventListener("click",()=>{ Sound.toggle(); refreshSoundBtn(); });
  refreshSoundBtn();
  const musicBtn=el("c-music");
  function refreshMusicBtn(){ musicBtn.textContent="🎵 Musik: "+Music.label(); }
  musicBtn.addEventListener("click",()=>{ Music.resume(); Music.cycle(); refreshMusicBtn(); });
  refreshMusicBtn();

  let tsx=0,tsy=0,tt=0;
  canvas.addEventListener("touchstart",e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tt=performance.now(); },{passive:true});
  canvas.addEventListener("touchend",e=>{
    if(!running||paused||over) return;
    const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy, dt=performance.now()-tt;
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&dt<250){ tryRotate(); draw(); return; }
    if(Math.abs(dx)>Math.abs(dy)){ move(dx>0?1:-1); draw(); }
    else if(dy>24){ if(dy>90){ hardDrop(); acc=0; updateUI(); } else softDrop(); draw(); }
  },{passive:true});

  board=emptyBoard(); updateUI(); draw();
})();
</script>
