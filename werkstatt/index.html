<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔧 KMF-Werkstatt – Bau deine Fahrschule aus!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rot:#E2231A;
    --rot-d:#a5140e;
    --gelb:#FFC300;
    --gruen:#3FA535;
    --gruen-d:#2f6b1d;
    --creme:#fffaf0;
    --creme-d:#efe0be;
    --gold:#b98a3c;
    --braun:#6a4a12;
    --text:#4a3a1c;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:Oswald, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:radial-gradient(120% 95% at 32% 0%, #cfe4f2 0%, #8fb8d4 42%, #4f7f9d 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 10px 62px;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow-x:hidden;
  }
  .anton{ font-family:Anton, Impact, sans-serif; font-weight:400; letter-spacing:.5px; }

  /* ---------- Kopf ---------- */
  .kopfband{
    position:relative; width:100%; max-width:1040px;
    background:linear-gradient(180deg,var(--rot),var(--rot-d));
    border-radius:16px; box-shadow:0 8px 0 rgba(0,0,0,.22);
    padding:10px 14px; display:flex; align-items:center; gap:10px; overflow:hidden;
  }
  .kopfband::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 14px, rgba(255,255,255,0) 14px 28px);
    pointer-events:none;
  }
  .kopfband h1{
    font-family:Anton, Impact, sans-serif; font-weight:400;
    font-size:clamp(1.05rem, 4.2vw, 1.7rem); color:#fff; margin:0; line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.28); flex:1 1 auto;
  }
  .kopf-knopf{
    position:relative; z-index:2; flex:0 0 auto;
    background:linear-gradient(180deg,#fff6e0,var(--creme-d));
    border:3px solid var(--gold); border-radius:999px;
    color:var(--braun); font-family:Anton,sans-serif; font-size:.82rem;
    padding:6px 12px; text-decoration:none; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.2);
  }

  /* ---------- HUD ---------- */
  .hud{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0 6px; }
  .pille{
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(180deg,#fff6e0,var(--creme-d));
    border:4px solid var(--gold); border-radius:999px;
    padding:3px 14px 3px 3px; box-shadow:0 5px 0 rgba(0,0,0,.18);
  }
  .pille .rund{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:Anton,sans-serif; font-size:1.05rem; color:#7a4b00;
    background:linear-gradient(160deg,#ffdc5e,#e9a400);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
  }
  .pille .rund.rt{ background:linear-gradient(160deg,#ff5a4d,#c81c12); color:#fff; }
  .pille .rund.gr{ background:linear-gradient(160deg,#7fd85e,#3d8a26); color:#fff; }
  .pille b{ font-family:Anton,sans-serif; font-weight:400; font-size:1.1rem; color:var(--braun); }
  .pille small{ font-size:.62rem; text-transform:uppercase; letter-spacing:.5px; color:#8a6b32; display:block; line-height:1; }

  /* ---------- Ebenen-Umschalter ---------- */
  .ebenen{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
  .ebene{
    font-family:Anton,sans-serif; font-size:.78rem; letter-spacing:.5px;
    background:linear-gradient(180deg,var(--creme),var(--creme-d));
    border:4px solid var(--gold); border-radius:14px;
    color:var(--braun); padding:6px 12px; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .ebene.aktiv{
    background:linear-gradient(180deg,var(--rot),var(--rot-d));
    border-color:#7d0f0a; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.22);
  }
  .ebene .rest{ display:block; font-family:Oswald,sans-serif; font-size:.6rem; opacity:.8; }

  /* ---------- Isometrische Bühne ---------- */
  .buehne-rahmen{
    position:relative; width:100%; max-width:1040px;
    border:6px solid var(--gold); border-radius:22px; overflow:hidden;
    box-shadow:0 10px 0 rgba(0,0,0,.22); background:#7ea9c6;
  }
  .buehne{ position:relative; width:100%; overflow:hidden; }
  .iso-welt{
    position:absolute; left:50%; top:0; width:0; height:0;
    transform-style:preserve-3d;
  }
  .iso-teil{ position:absolute; }
  .iso-teil span{
    display:flex; width:100%; height:100%; align-items:center; justify-content:center;
    font-family:Anton,sans-serif; white-space:nowrap;
  }
  .himmel{ position:absolute; inset:0; }
  .dunkel{ position:absolute; inset:0; background:#0b1220; opacity:.62; pointer-events:none; }
  .vignette{ position:absolute; inset:0; pointer-events:none;
             background:radial-gradient(88% 82% at 50% 46%, rgba(0,0,0,0) 55%, rgba(8,12,18,.45) 100%); }
  .marker{ position:absolute; cursor:pointer; }
  .marker i{
    display:flex; align-items:center; justify-content:center;
    width:46px; height:46px; margin-left:-23px; border-radius:50%;
    background:linear-gradient(160deg,#FFD84D,#E2A200); border:4px solid #fff;
    box-shadow:0 8px 16px rgba(0,0,0,.45);
    font-family:Anton,sans-serif; font-style:normal; font-size:1.6rem; color:#7a4b00;
    animation:kmfPuls 1.4s infinite;
  }
  .marker.zuteuer i{ opacity:.72; }
  @keyframes kmfPuls{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.12) } }
  .blitz{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .blitz.an{ animation:blitzen .6s ease-out; }
  @keyframes blitzen{ 0%{opacity:.8} 100%{opacity:0} }

  /* ---------- Aufgaben ---------- */
  .panel{
    width:100%; max-width:1040px; margin-top:12px;
    background:linear-gradient(180deg,var(--creme),#f0e2c4);
    border:5px solid var(--gold); border-radius:20px;
    box-shadow:0 8px 0 rgba(0,0,0,.22); overflow:hidden;
  }
  .panel-kopf{
    background:linear-gradient(180deg,var(--rot),#b4160f);
    padding:9px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .panel-kopf .anton{ color:#fff; font-size:1.05rem; }
  .panel-kopf small{ color:#ffd7d4; font-size:.75rem; font-weight:600; }
  .auf-liste{ display:grid; gap:8px; padding:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  .auf{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.5);
        border:2px solid rgba(185,138,60,.4); border-radius:12px; padding:7px 10px; }
  .auf .nr{ flex:0 0 auto; width:32px; height:32px; border-radius:9px; background:var(--gruen);
            display:flex; align-items:center; justify-content:center;
            font-family:Anton,sans-serif; color:#fff; font-size:.95rem; }
  .auf .tx{ flex:1 1 auto; min-width:0; }
  .auf .tx b{ display:block; font-weight:600; font-size:.9rem; color:var(--text); line-height:1.15; }
  .auf .tx span{ display:block; font-size:.72rem; color:#8a7448; }
  .auf .preis{ flex:0 0 auto; font-family:Anton,sans-serif; font-size:.95rem; color:var(--gold); cursor:pointer; }
  .auf .preis.kann{ color:#fff; background:linear-gradient(180deg,#6cc94a,#3d8a26);
                    border:2px solid var(--gruen-d); border-radius:999px; padding:4px 11px;
                    box-shadow:0 3px 0 rgba(0,0,0,.2); }
  .auf.fertig{ background:rgba(63,165,53,.16); border-color:rgba(63,165,53,.5); }
  .auf.fertig .preis{ color:var(--gruen); }

  /* ---------- Spiel-Knopf ---------- */
  .spiel-start{ display:flex; align-items:center; gap:14px; margin-top:14px; }
  .spiel-start .txt{ text-align:right; font-size:.9rem; font-weight:500; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.55); }
  .spiel-start .txt b{ display:block; font-family:Anton,sans-serif; font-weight:400; font-size:1.25rem; }
  .los{
    width:112px; height:78px; border:5px solid var(--gruen-d);
    border-radius:20px 44px 44px 20px; cursor:pointer;
    background:linear-gradient(180deg,#6cc94a,#3d8a26);
    font-family:Anton,sans-serif; font-size:1.9rem; color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.25); box-shadow:0 7px 0 rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
    animation:kmfSchweb 2.4s infinite;
  }
  @keyframes kmfSchweb{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }

  .knopfreihe{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .knopf{
    font-family:Anton,sans-serif; font-size:.85rem; cursor:pointer; color:var(--braun);
    background:linear-gradient(180deg,var(--creme),var(--creme-d));
    border:4px solid var(--gold); border-radius:14px; padding:7px 15px;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
  }

  /* ---------- Spielfeld ---------- */
  .view{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .view[hidden]{ display:none; }
  .ziele{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:8px 0 10px; }
  .ziel{ display:flex; align-items:center; gap:6px;
         background:linear-gradient(180deg,#fff6e0,var(--creme-d));
         border:4px solid var(--gold); border-radius:14px; padding:3px 12px 3px 4px;
         box-shadow:0 4px 0 rgba(0,0,0,.18); }
  .ziel svg{ width:34px; height:34px; }
  .ziel b{ font-family:Anton,sans-serif; font-weight:400; font-size:1.05rem; color:var(--braun); }
  .ziel.ok{ background:linear-gradient(180deg,#d8f4cf,#a9e39a); border-color:var(--gruen-d); }
  .ziel.ok b{ color:#1f5c17; }
  .brett-rahmen{
    background:linear-gradient(180deg,var(--creme),#e8d9b6);
    border:6px solid var(--gold); border-radius:22px; padding:8px;
    box-shadow:0 9px 0 rgba(0,0,0,.22);
  }
  .brett{
    position:relative; border-radius:14px; touch-action:none; overflow:hidden;
    background:linear-gradient(160deg,#5c626a 0%,#464b52 55%,#3a3f45 100%);
    box-shadow:inset 0 0 40px rgba(0,0,0,.55);
  }
  .loch{ position:absolute; border-radius:9px; background:rgba(0,0,0,.2); box-shadow:inset 0 2px 5px rgba(0,0,0,.35); }
  .stein{ position:absolute; display:grid; place-items:center; transition:transform .17s ease; will-change:transform; }
  .stein svg{ width:100%; height:100%; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .stein.gewaehlt::after{ content:""; position:absolute; inset:-3px; border-radius:12px;
                          border:3px solid var(--gelb); box-shadow:0 0 14px rgba(255,195,0,.7); }
  .stein.weg{ animation:wegPuff .22s ease-in forwards; }
  @keyframes wegPuff{ to{ transform:var(--t) scale(.15) rotate(24deg); opacity:0 } }
  .funke{ position:absolute; pointer-events:none; border-radius:999px;
          background:radial-gradient(circle,#fff 0%,var(--gelb) 45%,rgba(255,195,0,0) 70%);
          animation:funkeWeg .45s ease-out forwards; }
  @keyframes funkeWeg{ from{opacity:.9; transform:scale(.4)} to{opacity:0; transform:scale(1.6)} }
  .strahl{ position:absolute; pointer-events:none; border-radius:8px;
           background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));
           animation:strahlWeg .38s ease-out forwards; }
  .strahl.v{ background:linear-gradient(180deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0)); }
  @keyframes strahlWeg{ from{opacity:.95} to{opacity:0} }
  .hinweis{ max-width:430px; text-align:center; font-size:.72rem; color:#0f2b3d; margin:10px 0 0; font-weight:500; }

  /* ---------- Overlay ---------- */
  .ov{ position:fixed; inset:0; background:rgba(8,20,32,.78); backdrop-filter:blur(4px);
       display:none; align-items:center; justify-content:center; padding:20px; z-index:80; }
  .ov.an{ display:flex; }
  .karte{
    background:linear-gradient(180deg,var(--creme),#f0e2c4);
    border:6px solid var(--gold); border-radius:24px; padding:22px 24px; text-align:center;
    max-width:340px; width:100%; box-shadow:0 14px 0 rgba(0,0,0,.3);
  }
  .karte h2{ font-family:Anton,sans-serif; font-weight:400; margin:0 0 8px; font-size:1.35rem; color:var(--rot); }
  .karte p{ margin:0 0 14px; font-size:.88rem; color:var(--text); }
  .sterne{ font-size:2.1rem; letter-spacing:6px; margin:4px 0 12px; color:var(--gelb);
           text-shadow:0 2px 0 rgba(0,0,0,.2); }
  .sterne .aus{ color:#d8cbaa; text-shadow:none; }

  /* ---------- Slogan ---------- */
  .slogan{
    position:fixed; left:0; right:0; bottom:0; height:34px; z-index:50;
    background:linear-gradient(90deg,var(--rot) 0 34%,var(--gelb) 34% 67%,var(--gruen) 67% 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:Anton,sans-serif; font-size:.72rem; color:#fff; letter-spacing:1.5px;
    text-shadow:0 2px 0 rgba(0,0,0,.25); text-align:center; padding:0 8px;
  }
</style>
</head>
<body>

<div class="kopfband">
  <a href="../" class="kopf-knopf">🎮 Spiele</a>
  <h1>Bau deine Fahrschule aus!</h1>
  <button class="kopf-knopf" id="b-sound" aria-label="Ton ein/aus">🔊</button>
</div>

<!-- ============================ FAHRSCHULE ============================ -->
<section class="view" id="v-haus">
  <div class="hud">
    <div class="pille"><div class="rund">★</div><div><b id="s-sterne">0</b><small>Sterne</small></div></div>
    <div class="pille"><div class="rund gr" id="s-lvl-rund">1</div><div><b id="s-fertig">0/29</b><small>Aufträge</small></div></div>
  </div>

  <div class="ebenen" id="ebenen"></div>

  <div class="buehne-rahmen">
    <div class="buehne" id="buehne">
      <div class="himmel" id="himmel"></div>
      <div class="iso-welt" id="welt"></div>
      <div class="dunkel" id="dunkel" hidden></div>
      <div class="vignette"></div>
      <div class="blitz" id="blitz"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-kopf">
      <div class="anton" id="panel-titel">AUFTRÄGE</div>
      <small id="panel-zahl">0 / 0 erledigt</small>
    </div>
    <div class="auf-liste" id="aufgaben"></div>
  </div>

  <div class="spiel-start">
    <div class="txt">Nächste Runde<b id="s-level-txt">LEVEL 1</b></div>
    <button class="los" id="b-spielen">1</button>
  </div>

  <div class="knopfreihe">
    <button class="knopf" id="b-reset">↺ Alles zurücksetzen</button>
  </div>
</section>

<!-- ============================ SPIELFELD ============================ -->
<section class="view" id="v-spiel" hidden>
  <div class="hud">
    <div class="pille"><div class="rund gr" id="s-lvl">1</div><div><b id="s-zuege">28</b><small>Züge</small></div></div>
    <div class="pille"><div class="rund rt">P</div><div><b id="s-punkte">0</b><small>Punkte</small></div></div>
    <div class="pille"><div class="rund">★</div><div><b id="s-sterne2">0</b><small>Sterne</small></div></div>
  </div>
  <div class="ziele" id="ziele"></div>
  <div class="brett-rahmen"><div class="brett" id="brett"></div></div>
  <p class="hinweis">4 gleiche in einer Reihe = Turbo-Teil · Kreuz = Bombe · 5 gleiche = Regenbogen-Rad</p>
  <div class="knopfreihe">
    <button class="knopf" id="b-neustart">↻ Neu starten</button>
    <button class="knopf" id="b-haus">🏢 Zur Fahrschule</button>
  </div>
</section>

<div class="ov" id="ov">
  <div class="karte">
    <h2 id="ov-titel">Geschafft!</h2>
    <div class="sterne" id="ov-sterne"></div>
    <p id="ov-text"></p>
    <button class="los" id="ov-knopf" style="width:auto;padding:0 26px;border-radius:18px;margin:0 auto;font-size:1.1rem;">Weiter</button>
  </div>
</div>

<div class="slogan">DEIN WEG. DEIN ZIEL. WIR FAHREN IHN MIT DIR!</div>

<div id="kmf-defs" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const schlaf = ms => new Promise(r => setTimeout(r, ms));

/* ================================================================
   1. SPIELSTEINE (SVG)
   ================================================================ */
const TEILE = [
  { id:"pneu",       name:"Pneu",               farbe:"#94a3b8" },
  { id:"dreieck",    name:"Warndreieck",        farbe:"#ef4444" },
  { id:"pylone",     name:"Leitkegel",          farbe:"#f97316" },
  { id:"weste",      name:"Warnweste",          farbe:"#facc15" },
  { id:"baum",       name:"Duftbaum",           farbe:"#22c55e" },
  { id:"schluessel", name:"Schraubenschlüssel", farbe:"#3b82f6" }
];
const ANZ_TYPEN = TEILE.length;

function profil(){
  let s = "";
  for (let i = 0; i < 16; i++) s += `<rect x="45" y="7.5" width="10" height="16" rx="3" transform="rotate(${i*22.5} 50 52)"/>`;
  return s;
}
function speichen(){
  let s = "";
  for (let i = 0; i < 5; i++) s += `<rect x="47" y="32" width="6" height="22" rx="3" transform="rotate(${i*72} 50 52)"/>`;
  return s;
}
function regenbogenKuchen(){
  let s = "";
  const farben = TEILE.map(t => t.farbe);
  for (let i = 0; i < 6; i++){
    const a1 = (i*60 - 90) * Math.PI/180, a2 = ((i+1)*60 - 90) * Math.PI/180, R = 34;
    const x1 = 50 + R*Math.cos(a1), y1 = 52 + R*Math.sin(a1);
    const x2 = 50 + R*Math.cos(a2), y2 = 52 + R*Math.sin(a2);
    s += `<path d="M50,52 L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${farben[i]}"/>`;
  }
  return s;
}

$("kmf-defs").innerHTML = `
<svg xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="g-gummi" cx="34%" cy="26%" r="80%">
    <stop offset="0" stop-color="#6b7280"/><stop offset="45%" stop-color="#2f343c"/><stop offset="1" stop-color="#0e1014"/>
  </radialGradient>
  <linearGradient id="g-felge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="45%" stop-color="#9aa5b1"/><stop offset="1" stop-color="#4b5563"/>
  </linearGradient>
  <linearGradient id="g-rot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f87171"/><stop offset="45%" stop-color="#dc2626"/><stop offset="1" stop-color="#7f1d1d"/>
  </linearGradient>
  <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdba74"/><stop offset="42%" stop-color="#f97316"/><stop offset="1" stop-color="#9a3412"/>
  </linearGradient>
  <linearGradient id="g-gelb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fef08a"/><stop offset="45%" stop-color="#facc15"/><stop offset="1" stop-color="#a16207"/>
  </linearGradient>
  <linearGradient id="g-gruen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#86efac"/><stop offset="45%" stop-color="#22c55e"/><stop offset="1" stop-color="#14532d"/>
  </linearGradient>
  <linearGradient id="g-blau" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#93c5fd"/><stop offset="45%" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/>
  </linearGradient>
  <linearGradient id="g-chrom" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="30%" stop-color="#cbd5e1"/>
    <stop offset="55%" stop-color="#64748b"/><stop offset="80%" stop-color="#e2e8f0"/><stop offset="1" stop-color="#475569"/>
  </linearGradient>
  <linearGradient id="g-silber" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/>
  </linearGradient>
  <radialGradient id="g-schein" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="g-feuer" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fef08a"/><stop offset="50%" stop-color="#f97316"/><stop offset="1" stop-color="#dc2626"/>
  </linearGradient>

function steinSVG(typ, spezial){
  if (spezial === "farbe") return `<svg viewBox="0 0 100 100"><use href="#t-bombe-farbe"/></svg>`;
  let s = `<svg viewBox="0 0 100 100"><use href="#t-${TEILE[typ].id}"/>`;
  if (spezial === "reihe")  s += `<use href="#ov-reihe"/>`;
  if (spezial === "spalte") s += `<use href="#ov-spalte"/>`;
  if (spezial === "bombe")  s += `<use href="#ov-bombe"/>`;
  return s + `</svg>`;
}

   ================================================================ */
const KEY = "kmf-werkstatt-v2";
let ton = localStorage.getItem(KEY + "-ton") !== "0";
let ctx = null;
function tonAn(){
  if (!ctx){ try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ctx && ctx.state === "suspended") ctx.resume();
}
function piep(f, dauer, art, laut){
  if (!ton || !ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = art || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(laut || .12, ctx.currentTime + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dauer);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dauer + .02);
}
const sndTausch  = () => piep(420, .08, "sine", .07);
const sndTreffer = k => piep(430 + Math.min(k,6)*70, .13, "triangle", .1);
const sndSpezial = () => { piep(300,.18,"sawtooth",.09); setTimeout(()=>piep(700,.16,"square",.06),70); };
const sndFehler  = () => piep(150, .12, "sine", .06);
const sndStern   = () => { [660,880,1180].forEach((f,i)=>setTimeout(()=>piep(f,.18,"triangle",.11), i*90)); };

/* ================================================================
   3. ISOMETRISCHE BAUTEILE
   ================================================================
   x = nach rechts-oben, y = nach rechts-unten, z = Höhe.
   Sichtbar sind: Oberseite, die +y-Seite und die -x-Seite.
   ================================================================ */
function stil(p){ return p.s ? p.s : ""; }
function beschriftung(p){
  return p.txt ? `<span style="${p.ts || "font-size:26px;color:rgba(255,255,255,.85)"}">${p.txt}</span>` : "";
}
function teilHtml(p){
  const zu = p.vor ? ` data-vor="${p.vor}"` : (p.nach ? ` data-nach="${p.nach}"` : "");
  const f = p.f || "#999";
  if (p.t === "k"){  // Scheibe / Kugel von oben
    return `<div class="iso-teil"${zu} style="left:${p.x}px;top:${p.y}px;width:${p.d}px;height:${p.d}px;`
         + `transform:translateZ(${p.z||0}px);background:${f};border-radius:50%;${stil(p)}"></div>`;
  }
  if (p.t === "p"){  // flache Platte
    return `<div class="iso-teil"${zu} style="left:${p.x}px;top:${p.y}px;width:${p.b}px;height:${p.d}px;`
         + `transform:translateZ(${p.z||0}px);background:${f};${stil(p)}">${beschriftung(p)}</div>`;
  }
  if (p.t === "w"){  // senkrechte Fläche, schaut nach +y (z.B. Tor, Schild)
    return `<div class="iso-teil"${zu} style="left:${p.x}px;top:${p.y}px;width:${p.b}px;height:${p.h}px;`
         + `transform-origin:0 0;transform:translateZ(${(p.z||0)+p.h}px) rotateX(-90deg);background:${f};${stil(p)}">`
         + beschriftung(p) + `</div>`;
  }
  // Quader
  const z = p.z || 0, h = p.h;
  const oben  = `<div class="iso-teil"${zu} style="left:${p.x}px;top:${p.y}px;width:${p.b}px;height:${p.d}px;`
              + `transform:translateZ(${z+h}px);background:${f};${p.rad?`border-radius:${p.rad};`:""}${stil(p)}">${beschriftung(p)}</div>`;
  const vorne = `<div class="iso-teil"${zu} style="left:${p.x}px;top:${p.y+p.d}px;width:${p.b}px;height:${h}px;`
              + `transform-origin:0 0;transform:translateZ(${z+h}px) rotateX(-90deg);background:${f};filter:brightness(.8);"></div>`;
  const links = `<div class="iso-teil"${zu} style="left:${p.x}px;top:${p.y}px;width:${h}px;height:${p.d}px;`
              + `transform-origin:0 0;transform:translateZ(${z}px) rotateY(-90deg);background:${f};filter:brightness(.62);"></div>`;
  return oben + vorne + links;
}

  let d;
  if (nr <= LEVELS.length) d = LEVELS[nr-1];

    const stufe = Math.floor(extra / 6);
    const a = (nr*3) % ANZ_TYPEN, b = (nr*5+2) % ANZ_TYPEN, c = (nr*7+4) % ANZ_TYPEN;
    const typen = [...new Set([a, b, c])].slice(0, 2 + (nr % 2));

    d = { zuege: Math.max(15, 20 - stufe), ziele: typen.map(t => [t, menge]) };

const N = 8, LUECKE = 4, RAND = 6;
let ZELLE = 44;
const brett = $("brett");
let feld = [];
let idZaehler = 1;
let sperre = true;
let gewaehlt = null;
let lvlNr = 1, lvlDaten = null, zuegeRest = 0, punkte = 0, fortschritt = [];
let letzteTauschZelle = -1;

const posX = c => RAND + c * (ZELLE + LUECKE);
const posY = r => RAND + r * (ZELLE + LUECKE);

function groesseAnpassen(){
  const maxB = Math.min(window.innerWidth - 40, 452);
  let z = Math.floor((maxB - 2*RAND - (N-1)*LUECKE) / N);
  ZELLE = Math.max(30, Math.min(50, z));
  const seite = 2*RAND + N*ZELLE + (N-1)*LUECKE;
  brett.style.width = seite + "px";

    l.style.top = posY(r) + "px";
  });

    const s = feld[r] && feld[r][c];
    if (s) setzePosition(s, r, c, true);

}
function loecherBauen(){

    brett.insertBefore(d, brett.firstChild);

}
function setzePosition(s, r, c, sofort){
  s.el.style.width = s.el.style.height = ZELLE + "px";
  const t = `translate(${posX(c)}px, ${posY(r)}px)`;
  if (sofort){
    s.el.style.transition = "none";
    s.el.style.transform = t;
    s.el.style.setProperty("--t", t);
    void s.el.offsetWidth;
    s.el.style.transition = "";
  } else {
    s.el.style.transform = t;
    s.el.style.setProperty("--t", t);
  }
}
function neuerStein(typ, spezial){
  const el = document.createElement("div");
  el.className = "stein";
  el.innerHTML = steinSVG(typ, spezial || null);
  brett.appendChild(el);
  return { id: idZaehler++, typ, spezial: spezial || null, el };
}
function steinNeuZeichnen(s){ s.el.innerHTML = steinSVG(s.typ, s.spezial); }
function feldLeeren(){
  brett.querySelectorAll(".stein, .funke, .strahl").forEach(e => e.remove());
  feld = [];
  for (let r = 0; r < N; r++) feld.push(new Array(N).fill(null));
}
function machtTreffer(r, c, typ){
  const g = (rr, cc) => (rr >= 0 && cc >= 0 && rr < N && cc < N && feld[rr][cc]) ? feld[rr][cc].typ : -1;
  if (g(r, c-1) === typ && g(r, c-2) === typ) return true;
  if (g(r-1, c) === typ && g(r-2, c) === typ) return true;
  return false;
}
function feldFuellen(){
  feldLeeren();
  for (let r = 0; r < N; r++){
    for (let c = 0; c < N; c++){
      let typ, versuche = 0;
      do { typ = Math.floor(Math.random() * ANZ_TYPEN); versuche++; }
      while (versuche < 30 && machtTreffer(r, c, typ));
      const s = neuerStein(typ);
      feld[r][c] = s;
      setzePosition(s, r, c, true);
    }
  }
  if (!zugMoeglich()) feldFuellen();
}
function gruppenFinden(){
  const laeufe = [];
  for (let r = 0; r < N; r++){
    let c = 0;
    while (c < N){
      const s = feld[r][c];
      if (!s){ c++; continue; }
      let e = c;
      while (e + 1 < N && feld[r][e+1] && feld[r][e+1].typ === s.typ) e++;
      if (e - c + 1 >= 3){
        const zellen = [];
        for (let i = c; i <= e; i++) zellen.push(r*N + i);
        laeufe.push({ typ: s.typ, zellen, richtung:"h", laenge: e - c + 1 });
      }
      c = e + 1;
    }
  }
  for (let c = 0; c < N; c++){
    let r = 0;
    while (r < N){
      const s = feld[r][c];
      if (!s){ r++; continue; }
      let e = r;
      while (e + 1 < N && feld[e+1][c] && feld[e+1][c].typ === s.typ) e++;
      if (e - r + 1 >= 3){
        const zellen = [];
        for (let i = r; i <= e; i++) zellen.push(i*N + c);
        laeufe.push({ typ: s.typ, zellen, richtung:"v", laenge: e - r + 1 });
      }
      r = e + 1;
    }
  }
  if (!laeufe.length) return [];
  const benutzt = new Array(laeufe.length).fill(false);
  const gruppen = [];
  for (let i = 0; i < laeufe.length; i++){
    if (benutzt[i]) continue;
    const teil = [i]; benutzt[i] = true;
    const zellen = new Set(laeufe[i].zellen);
    let gewachsen = true;
    while (gewachsen){
      gewachsen = false;
      for (let j = 0; j < laeufe.length; j++){
        if (benutzt[j]) continue;
        if (laeufe[j].zellen.some(z => zellen.has(z))){
          benutzt[j] = true; teil.push(j);
          laeufe[j].zellen.forEach(z => zellen.add(z));
          gewachsen = true;
        }
      }
    }
    let maxH = 0, maxV = 0;
    teil.forEach(k => {
      if (laeufe[k].richtung === "h") maxH = Math.max(maxH, laeufe[k].laenge);
      else maxV = Math.max(maxV, laeufe[k].laenge);
    });
    gruppen.push({ typ: laeufe[i].typ, zellen: [...zellen], maxH, maxV });
  }
  return gruppen;
}
function spezialFuer(g){
  if (g.maxH >= 5 || g.maxV >= 5) return "farbe";
  if (g.maxH >= 3 && g.maxV >= 3) return "bombe";
  if (g.maxH === 4) return "reihe";
  if (g.maxV === 4) return "spalte";
  return null;
}
function funkeAn(r, c){
  const d = document.createElement("div");
  d.className = "funke";
  const gr = ZELLE * 1.5;
  d.style.width = d.style.height = gr + "px";
  d.style.left = (posX(c) + ZELLE/2 - gr/2) + "px";
  d.style.top = (posY(r) + ZELLE/2 - gr/2) + "px";
  brett.appendChild(d);
  setTimeout(() => d.remove(), 470);
}
function strahlAn(r, c, senkrecht){
  const d = document.createElement("div");
  d.className = "strahl" + (senkrecht ? " v" : "");
  if (senkrecht){
    d.style.width = ZELLE * .5 + "px"; d.style.height = "100%";
    d.style.left = (posX(c) + ZELLE*.25) + "px"; d.style.top = "0";
  } else {
    d.style.height = ZELLE * .5 + "px"; d.style.width = "100%";
    d.style.top = (posY(r) + ZELLE*.25) + "px"; d.style.left = "0";
  }
  brett.appendChild(d);
  setTimeout(() => d.remove(), 400);
}
function haeufigsterTyp(){
  const z = new Array(ANZ_TYPEN).fill(0);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (feld[r][c]) z[feld[r][c].typ]++;
  let best = 0;
  for (let i = 1; i < ANZ_TYPEN; i++) if (z[i] > z[best]) best = i;
  return best;
}
function ausbreiten(startZellen, farbeZiel){
  const raus = new Set();
  const warte = [...startZellen];
  let spezialAusgeloest = false;
  while (warte.length){
    const k = warte.pop();
    if (raus.has(k)) continue;
    const r = Math.floor(k / N), c = k % N;
    const s = feld[r][c];
    if (!s) continue;
    raus.add(k);
    if (!s.spezial) continue;
    spezialAusgeloest = true;
    if (s.spezial === "reihe"){
      strahlAn(r, c, false);
      for (let i = 0; i < N; i++) if (feld[r][i]) warte.push(r*N + i);
    } else if (s.spezial === "spalte"){
      strahlAn(r, c, true);
      for (let i = 0; i < N; i++) if (feld[i][c]) warte.push(i*N + c);
    } else if (s.spezial === "bombe"){
      funkeAn(r, c);
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && cc >= 0 && rr < N && cc < N && feld[rr][cc]) warte.push(rr*N + cc);
      }
    } else if (s.spezial === "farbe"){
      const zielTyp = (farbeZiel === null || farbeZiel === undefined) ? haeufigsterTyp() : farbeZiel;
      for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++)
        if (feld[rr][cc] && feld[rr][cc].typ === zielTyp) warte.push(rr*N + cc);
    }
  }
  return { raus, spezialAusgeloest };
}
async function entfernen(zellen, kette){
  const liste = [...zellen];
  if (!liste.length) return;
  liste.forEach(k => {
    const r = Math.floor(k / N), c = k % N;
    const s = feld[r][c];
    if (!s) return;
    fortschritt[s.typ] = (fortschritt[s.typ] || 0) + 1;
    punkte += 60 * Math.min(kette, 8);
    s.el.classList.add("weg");
    setTimeout(() => s.el.remove(), 240);
    feld[r][c] = null;
    if (Math.random() < .35) funkeAn(r, c);
  });
  sndTreffer(kette);
  zieleZeichnen();
  hudAktualisieren();
  await schlaf(210);
}
async function fallenLassen(){
  let bewegt = false;
  for (let c = 0; c < N; c++){
    let schreib = N - 1;
    for (let r = N - 1; r >= 0; r--){
      if (feld[r][c]){
        if (schreib !== r){
          feld[schreib][c] = feld[r][c];
          feld[r][c] = null;
          setzePosition(feld[schreib][c], schreib, c, false);
          bewegt = true;
        }
        schreib--;
      }
    }
    let ueber = 1;
    for (let r = schreib; r >= 0; r--){
      const s = neuerStein(Math.floor(Math.random() * ANZ_TYPEN));
      feld[r][c] = s;
      setzePosition(s, -ueber, c, true);
      setzePosition(s, r, c, false);
      ueber++;
      bewegt = true;
    }
  }
  if (bewegt) await schlaf(230);
}
async function kaskade(){
  let kette = 0;
  while (true){
    const gruppen = gruppenFinden();
    if (!gruppen.length) break;
    kette++;
    const neueSpezial = [];
    const startZellen = new Set();
    gruppen.forEach(g => {
      const sp = spezialFuer(g);
      let behalten = -1;
      if (sp){
        behalten = g.zellen.includes(letzteTauschZelle) ? letzteTauschZelle : g.zellen[Math.floor(g.zellen.length/2)];
        neueSpezial.push({ k: behalten, typ: g.typ, sp });
      }
      g.zellen.forEach(k => { if (k !== behalten) startZellen.add(k); });
    });
    const { raus, spezialAusgeloest } = ausbreiten([...startZellen], null);
    neueSpezial.forEach(n => raus.delete(n.k));
    if (spezialAusgeloest) sndSpezial();
    await entfernen(raus, kette);
    neueSpezial.forEach(n => {
      const r = Math.floor(n.k / N), c = n.k % N;
      const s = feld[r][c];
      if (s){
        s.spezial = n.sp;
        if (n.sp === "farbe") s.typ = n.typ;
        steinNeuZeichnen(s);
        funkeAn(r, c);
      }
    });
    if (neueSpezial.length){ sndSpezial(); await schlaf(120); }
    letzteTauschZelle = -1;
    await fallenLassen();
  }
}
function tauscheDaten(r1, c1, r2, c2){
  const t = feld[r1][c1];
  feld[r1][c1] = feld[r2][c2];
  feld[r2][c2] = t;
}
function zugMoeglich(){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const s = feld[r][c];
    if (!s) continue;
    if (s.spezial === "farbe") return true;
    if (c + 1 < N){
      tauscheDaten(r, c, r, c+1);
      const ok = gruppenFinden().length > 0;
      tauscheDaten(r, c, r, c+1);
      if (ok) return true;
    }
    if (r + 1 < N){
      tauscheDaten(r, c, r+1, c);
      const ok = gruppenFinden().length > 0;
      tauscheDaten(r, c, r+1, c);
      if (ok) return true;
    }
  }
  return false;
}
async function mischen(){
  sperre = true;
  const typen = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (feld[r][c]) typen.push(feld[r][c].typ);
  for (let i = typen.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [typen[i], typen[j]] = [typen[j], typen[i]];
  }
  let i = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const s = feld[r][c];
    if (s){ s.typ = typen[i++]; s.spezial = null; steinNeuZeichnen(s); }
  }
  await schlaf(200);
  if (gruppenFinden().length || !zugMoeglich()){ await mischen(); return; }
  sperre = false;
}
function auswahlLoeschen(){
  if (gewaehlt && feld[gewaehlt.r] && feld[gewaehlt.r][gewaehlt.c])
    feld[gewaehlt.r][gewaehlt.c].el.classList.remove("gewaehlt");
  gewaehlt = null;
}
async function zugSpielen(r1, c1, r2, c2){
  sperre = true;
  auswahlLoeschen();
  const a = feld[r1][c1], b = feld[r2][c2];
  if (!a || !b){ sperre = false; return; }
  tauscheDaten(r1, c1, r2, c2);
  setzePosition(feld[r1][c1], r1, c1, false);
  setzePosition(feld[r2][c2], r2, c2, false);
  sndTausch();
  await schlaf(190);

  const aFarbe = a.spezial === "farbe", bFarbe = b.spezial === "farbe";
  if (aFarbe || bFarbe){
    const zielTyp = (aFarbe && bFarbe) ? -1 : (aFarbe ? b.typ : a.typ);
    let raus;
    if (zielTyp === -1){
      raus = new Set();
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (feld[r][c]) raus.add(r*N + c);
    } else {
      raus = ausbreiten([r2*N + c2, r1*N + c1], zielTyp).raus;
    }
    zuegeRest--;
    sndSpezial();
    await entfernen(raus, 3);
    await fallenLassen();
    await kaskade();
    await nachZug();
    return;
  }
  if (a.spezial && b.spezial){
    zuegeRest--;
    const raus = ausbreiten([r1*N + c1, r2*N + c2], null).raus;
    sndSpezial();
    await entfernen(raus, 3);
    await fallenLassen();
    await kaskade();
    await nachZug();
    return;
  }
  if (!gruppenFinden().length){
    tauscheDaten(r1, c1, r2, c2);
    setzePosition(feld[r1][c1], r1, c1, false);
    setzePosition(feld[r2][c2], r2, c2, false);
    sndFehler();
    await schlaf(190);
    sperre = false;
    return;
  }
  zuegeRest--;
  letzteTauschZelle = r2*N + c2;
  hudAktualisieren();
  await kaskade();
  await nachZug();
}
async function nachZug(){
  hudAktualisieren();
  if (zieleErreicht()){ await schlaf(240); gewonnen(); return; }
  if (zuegeRest <= 0){ await schlaf(240); verloren(); return; }
  if (!zugMoeglich()) await mischen();
  sperre = false;
}
function zelleAus(ev){
  const b = brett.getBoundingClientRect();
  const x = ev.clientX - b.left, y = ev.clientY - b.top;
  const c = Math.floor((x - RAND) / (ZELLE + LUECKE));
  const r = Math.floor((y - RAND) / (ZELLE + LUECKE));
  if (r < 0 || c < 0 || r >= N || c >= N) return null;
  return { r, c };
}
let zieh = null;
brett.addEventListener("pointerdown", ev => {
  tonAn();
  if (sperre) return;
  const z = zelleAus(ev);
  if (!z) return;
  zieh = { r:z.r, c:z.c, x:ev.clientX, y:ev.clientY, aktiv:true };
  if (gewaehlt && (Math.abs(gewaehlt.r - z.r) + Math.abs(gewaehlt.c - z.c)) === 1){
    const g = gewaehlt;
    zieh.aktiv = false;
    zugSpielen(g.r, g.c, z.r, z.c);
    return;
  }
  auswahlLoeschen();
  gewaehlt = { r:z.r, c:z.c };
  if (feld[z.r][z.c]) feld[z.r][z.c].el.classList.add("gewaehlt");
});
brett.addEventListener("pointermove", ev => {
  if (!zieh || !zieh.aktiv || sperre) return;
  const dx = ev.clientX - zieh.x, dy = ev.clientY - zieh.y;
  const grenze = ZELLE * .45;
  if (Math.abs(dx) < grenze && Math.abs(dy) < grenze) return;
  let r2 = zieh.r, c2 = zieh.c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += dx > 0 ? 1 : -1;
  else r2 += dy > 0 ? 1 : -1;
  const r1 = zieh.r, c1 = zieh.c;
  zieh.aktiv = false;
  if (r2 < 0 || c2 < 0 || r2 >= N || c2 >= N) return;
  zugSpielen(r1, c1, r2, c2);
});
window.addEventListener("pointerup", () => { zieh = null; });

function zieleErreicht(){ return lvlDaten.ziele.every(([typ, anz]) => (fortschritt[typ] || 0) >= anz); }
function zieleZeichnen(){
  const box = $("ziele");
  box.innerHTML = "";
  lvlDaten.ziele.forEach(([typ, anz]) => {
    const habe = Math.min(fortschritt[typ] || 0, anz);
    const d = document.createElement("div");
    d.className = "ziel" + (habe >= anz ? " ok" : "");
    d.innerHTML = `<svg viewBox="0 0 100 100"><use href="#t-${TEILE[typ].id}"/></svg><b>${habe}/${anz}</b>`;
    box.appendChild(d);
  });
}
function hudAktualisieren(){
  $("s-lvl").textContent = lvlNr;
  $("s-zuege").textContent = Math.max(0, zuegeRest);
  $("s-punkte").textContent = punkte;
  $("s-sterne2").textContent = stand.sterne;
}
function levelStarten(nr){
  lvlNr = Math.min(nr, MAX_LEVEL);
  lvlDaten = levelDaten(lvlNr);
  zuegeRest = lvlDaten.zuege;
  punkte = 0;
  fortschritt = new Array(ANZ_TYPEN).fill(0);
  gewaehlt = null;
  loecherBauen();
  feldFuellen();
  groesseAnpassen();
  zieleZeichnen();
  hudAktualisieren();
  sperre = false;
}
function sterneText(n){
  let s = "";
  for (let i = 1; i <= 3; i++) s += `<span class="${i <= n ? "" : "aus"}">★</span>`;
  return s;
}
function zeigeKarte(titel, sterneHtml, text, knopf, aktion){
  $("ov-titel").innerHTML = titel;
  $("ov-sterne").innerHTML = sterneHtml || "";
  $("ov-text").textContent = text;
  $("ov-knopf").textContent = knopf;
  $("ov").classList.add("an");
  $("ov-knopf").onclick = () => { $("ov").classList.remove("an"); if (aktion) aktion(); };
}
function gewonnen(){
  sperre = true;
  let verdient = 1;
  if (punkte >= lvlDaten.p2) verdient++;
  if (punkte >= lvlDaten.p3) verdient++;
  const vorher = stand.besteSterne[lvlNr] || 0;
  const neu = Math.max(0, verdient - vorher);
  stand.besteSterne[lvlNr] = Math.max(vorher, verdient);
  stand.sterne += neu;
  if (lvlNr === stand.level && stand.level < MAX_LEVEL) stand.level = lvlNr + 1;
  speichern();
  sndStern();
  const text = neu > 0
    ? `${punkte} Punkte – du bekommst ${neu} ★ für den Ausbau.`
    : `${punkte} Punkte. Für dieses Level hattest du schon ${vorher} ★ – neue Sterne gibt es nur, wenn du dich verbesserst.`;
  zeigeKarte("🎉 Level geschafft!", sterneText(verdient), text, "Zur Fahrschule", () => {
    hausAktualisieren();
    ansichtWechseln("haus");
  });
}
function verloren(){
  sperre = true;
  zeigeKarte("😕 Züge aufgebraucht", "", "Die Aufträge sind noch nicht alle erfüllt. Probier es gleich nochmal!",
    "Nochmal", () => levelStarten(lvlNr));
}

/* ================================================================
   9. ANSICHTEN & START
   ================================================================ */
function ansichtWechseln(welche){
  $("v-haus").hidden = welche !== "haus";
  $("v-spiel").hidden = welche !== "spiel";
  if (welche === "haus"){ hausAktualisieren(); buehneAnpassen(); }
  else groesseAnpassen();
  window.scrollTo({ top:0, behavior:"smooth" });
}
$("b-spielen").addEventListener("click", () => {
  tonAn();
  levelStarten(stand.level);
  ansichtWechseln("spiel");
});
$("b-neustart").addEventListener("click", () => { tonAn(); levelStarten(lvlNr); });
$("b-haus").addEventListener("click", () => ansichtWechseln("haus"));
$("b-reset").addEventListener("click", () => {
  if (!confirm("Wirklich alles zurücksetzen? Sterne, Level und der ganze Ausbau fangen wieder von vorne an.")) return;
  stand = { level:1, sterne:0, erledigt:[], besteSterne:{}, bereich:"hof" };
  speichern();
  lvlDaten = null;
  bereichZeichnen("hof");
  hausAktualisieren();
});
$("b-sound").addEventListener("click", () => {
  ton = !ton;
  localStorage.setItem(KEY + "-ton", ton ? "1" : "0");
  $("b-sound").textContent = ton ? "🔊" : "🔇";
  if (ton) tonAn();
});
$("b-sound").textContent = ton ? "🔊" : "🔇";
window.addEventListener("resize", () => { buehneAnpassen(); groesseAnpassen(); });
window.addEventListener("orientationchange", () => setTimeout(() => { buehneAnpassen(); groesseAnpassen(); }, 200));

laden();
feldLeeren();
bereichZeichnen(stand.bereich);
hausAktualisieren();
ansichtWechseln("haus");
})();
</script>
